<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Interlink</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="workspace-overrides.css">
  <link rel="stylesheet" href="apparatus-controls.css">
  <link rel="stylesheet" href="feature-inspector.css">
  <link rel="stylesheet" href="debug-overlay.css">
</head>
<body>
  <div id="landing-screen">
    <h1>PROJECT INTERLINK</h1>
    <label for="seed-input">Seed</label>
    <input type="text" id="seed-input" placeholder="Enter seed or leave blank for random">
    <button id="generate-btn">Generate World</button>
  </div>

  <!-- ── Player workspace ──────────────────────────────────────────────────── -->
  <div id="player-view" style="display:none">
    <div class="ws-shell">
      <div class="ws-header">
        <nav id="ws-breadcrumbs" class="ws-breadcrumbs" aria-label="Workspace navigation"></nav>
      </div>
      <div id="ws-main" class="ws-main">
        <p class="ws-empty">Loading player workspace…</p>
      </div>
    </div>
  </div>

  <script type="module" src="dist/app.js"></script>
</body>
</html>
