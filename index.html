<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Interlink</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="workspace-overrides.css">
</head>
<body>
  <div id="landing-screen">
    <h1>PROJECT INTERLINK</h1>
    <label for="seed-input">Seed</label>
    <input type="text" id="seed-input" placeholder="Enter seed or leave blank for random">
    <button id="generate-btn">Generate World</button>
  </div>

  <!-- ── Player workspace ──────────────────────────────────────────────────── -->
  <div id="player-view" style="display:none">
    <div class="ws-shell">
      <button id="ws-navigation-toggle" class="ws-navigation-tab" type="button" aria-controls="ws-navigation-drawer" aria-expanded="false">
        <span aria-hidden="true">N<br>A<br>V</span>
        <span class="ws-visually-hidden">Open hierarchy navigation</span>
      </button>
      <aside id="ws-navigation-drawer" class="ws-navigation-drawer" aria-label="Hierarchy navigation" aria-hidden="true" hidden>
        <div class="ws-navigation-header">
          <strong>NAVIGATION</strong>
          <button id="ws-navigation-close" class="ws-navigation-close" type="button" aria-label="Close hierarchy navigation">×</button>
        </div>
        <label class="ws-navigation-search-label" for="ws-navigation-search">Search hierarchy</label>
        <input id="ws-navigation-search" class="ws-navigation-search" type="search" placeholder="Search hierarchy…" autocomplete="off">
        <details id="ws-navigation-filters" class="ws-navigation-filters-panel">
          <summary>Show filters</summary>
          <div class="ws-navigation-filters"></div>
        </details>
        <div id="ws-navigation-match-count" class="ws-navigation-match-count" aria-live="polite"></div>
        <div id="ws-navigation-tree" class="ws-navigation-tree" role="tree" aria-label="World hierarchy"></div>
      </aside>
      <div class="ws-header">
        <nav id="ws-breadcrumbs" class="ws-breadcrumbs" aria-label="Workspace navigation"></nav>
      </div>
      <div id="ws-main" class="ws-main">
        <p class="ws-empty">Loading player workspace…</p>
      </div>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
