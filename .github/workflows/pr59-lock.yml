name: PR59 Cargo Lock

on:
  push:
    branches:
      - chatgpt/rust-wasm-worker-cutover

permissions:
  contents: write

jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, '[pr59-lock]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rust-wasm-worker-cutover
          fetch-depth: 0

      - name: Generate workspace lockfile
        run: cargo generate-lockfile

      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock is already current."
            exit 0
          fi
          git commit -m "Lock Rust dependencies for browser package [pr59-lock]"
          git push origin HEAD:chatgpt/rust-wasm-worker-cutover
