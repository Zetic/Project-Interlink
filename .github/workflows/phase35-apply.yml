name: Apply Phase 3.5 map cleanup

on:
  push:
    branches: [phase-3-5-map-node-cleanup]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply validated cleanup payload
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/phase35.tgz
          tar -xzf /tmp/phase35.tgz
          npm install --ignore-scripts
          npm run build
          npm test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/world/types.ts src/world/generateWorld.ts src/map/mapRenderer.ts src/ui/inspectorPanel.ts map.css tests/mapWorldModel.test.js dist/world/generateWorld.js dist/map/mapRenderer.js dist/ui/inspectorPanel.js
          git commit -m 'Clean up map regions and restore resource nodes'
          git push origin HEAD:phase-3-5-map-node-cleanup
