name: TypeScript Foundation Pass
on:
  push:
    branches: [chatgpt/typescript-browser-conversion]
permissions:
  contents: write
jobs:
  pass:
    if: ${{ !contains(github.event.head_commit.message, '[ts-foundation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/typescript-browser-conversion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply type foundation annotations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements, prepend=None):
              p = Path(path)
              s = p.read_text()
              if prepend and prepend not in s:
                  s = prepend + s
              for old, new in replacements:
                  if old not in s:
                      print(f'WARN missing in {path}: {old[:80]!r}')
                  else:
                      s = s.replace(old, new)
              p.write_text(s)

          patch('src/app.ts', [
              ("function el(id) {\n  return document.getElementById(id);\n}", "function el<T extends HTMLElement = HTMLElement>(id: string): T | null {\n  return document.getElementById(id) as T | null;\n}"),
              ("const seed = el('seed-input')?.value.trim()", "const seed = el<HTMLInputElement>('seed-input')?.value.trim()"),
          ])

          patch('src/content/apparatus/definitions.ts', [
              ("const solidInputPort = (\n  id,\n  accepts = PORT_CAPABILITIES.SOLID_PARTICULATE,\n  runtimePortField = 'inputPortId',\n  label = id,\n)", "const solidInputPort = (\n  id: string,\n  accepts: string | readonly string[] = PORT_CAPABILITIES.SOLID_PARTICULATE,\n  runtimePortField = 'inputPortId',\n  label = id,\n)"),
              ("const solidOutputPort = (\n  id,\n  provides = [PORT_CAPABILITIES.SOLID_PARTICULATE],\n  runtimePortField = 'outputPortId',\n  label = id,\n)", "const solidOutputPort = (\n  id: string,\n  provides: string | readonly string[] = [PORT_CAPABILITIES.SOLID_PARTICULATE],\n  runtimePortField = 'outputPortId',\n  label = id,\n)"),
              ("const gasInputPort = (\n  id,", "const gasInputPort = (\n  id: string,"),
              ("const gasOutputPort = (\n  id,", "const gasOutputPort = (\n  id: string,"),
          ])

          patch('src/core/world/validation/hierarchyValidation.ts', [
              ("export function validateHierarchy(world) {", "export function validateHierarchy(world: import('../types.js').World) {"),
              ("const errors = [];", "const errors: string[] = [];"),
              ("const siteFeatureOwners = new Map();", "const siteFeatureOwners = new Map<string, string[]>();"),
          ])
          patch('src/core/world/validation/occurrenceValidation.ts', [
              ("function validateOccurrenceTexture(occurrenceId, occurrence, errors) {", "function validateOccurrenceTexture(occurrenceId: string, occurrence: import('../types.js').ResourceOccurrence, errors: string[]) {"),
              ("export function validateOccurrences(world) {", "export function validateOccurrences(world: import('../types.js').World) {"),
              ("const errors = [];", "const errors: string[] = [];"),
              ("const featureOccurrenceOwners = new Map();", "const featureOccurrenceOwners = new Map<string, string[]>();"),
          ])
          patch('src/core/world/validation/processHistoryValidation.ts', [
              ("export function validateProcessHistory(world) {", "export function validateProcessHistory(world: import('../types.js').World) {"),
              ("const errors = [];", "const errors: string[] = [];"),
              ("} catch (error) {\n      errors.push(`Material batch", "} catch (error) {\n      const message = error instanceof Error ? error.message : String(error);\n      errors.push(`Material batch"),
              ("has invalid materialBody: ${error.message}`);", "has invalid materialBody: ${message}`);"),
          ])

          patch('src/simulation/simulationEngine.ts', [
              ("const blueprintTopologyRevisionCache = new WeakMap();", "const blueprintTopologyRevisionCache = new WeakMap<object, number>();"),
              ("const blueprintPresentationRevisionCache = new WeakMap();", "const blueprintPresentationRevisionCache = new WeakMap<object, number>();"),
              ("const layoutPresentationRevisionCache = new WeakMap();", "const layoutPresentationRevisionCache = new WeakMap<object, number>();"),
              ("export function createBlueprint() {\n  const blueprint = {", "export function createBlueprint(): import('./types.js').Blueprint {\n  const blueprint: import('./types.js').Blueprint = {"),
              ("export function blueprintAddHopper(blueprint, capacityKg =", "export function blueprintAddHopper(blueprint: import('./types.js').Blueprint, capacityKg ="),
              ("export function blueprintAddApparatus(blueprint, nodeType, parameters = {}) {", "export function blueprintAddApparatus(blueprint: import('./types.js').Blueprint, nodeType: string, parameters: Record<string, unknown> = {}) {"),
              ("export function getNodePortDefinitions(node) {", "export function getNodePortDefinitions(node: import('./types.js').BlueprintNode | null | undefined): import('../core/systems/types.js').SystemPort[] {"),
              ("export function checkBlueprintConnection(blueprint, sourceNodeId, sourcePortId, targetNodeId, targetPortId, options = {}) {", "export function checkBlueprintConnection(blueprint: import('./types.js').Blueprint, sourceNodeId: string, sourcePortId: string, targetNodeId: string, targetPortId: string, options: { occurrenceId?: string | null } = {}): import('./types.js').ConnectionCheckResult {"),
              ("export function blueprintConnect(blueprint, sourceNodeId, sourcePortId, targetNodeId, targetPortId, options = {}) {", "export function blueprintConnect(blueprint: import('./types.js').Blueprint, sourceNodeId: string, sourcePortId: string, targetNodeId: string, targetPortId: string, options: { occurrenceId?: string | null } = {}) {"),
              ("export function blueprintDisconnect(blueprint, connectionId) {", "export function blueprintDisconnect(blueprint: import('./types.js').Blueprint, connectionId: string): void {"),
              ("export function getStreamForConnection(blueprint, connectionId) {", "export function getStreamForConnection(blueprint: import('./types.js').Blueprint, connectionId: string): import('./types.js').MaterialStream | null {"),
              ("export function setNodeEnabled(blueprint, nodeId, enabled) {", "export function setNodeEnabled(blueprint: import('./types.js').Blueprint, nodeId: string, enabled: boolean) {"),
              ("export function setApparatusParameter(blueprint, nodeId, parameterId, value) {", "export function setApparatusParameter(blueprint: import('./types.js').Blueprint, nodeId: string, parameterId: string, value: unknown) {"),
              ("export function getNodeOperatingState(node) {", "export function getNodeOperatingState(node: import('./types.js').BlueprintNode | null | undefined): string | null {"),
              ("export function createBlueprintLayout() {\n  const layout = { nodePositions: {} };", "export function createBlueprintLayout(): import('./types.js').BlueprintLayout {\n  const layout: import('./types.js').BlueprintLayout = { nodePositions: {} };"),
              ("export function layoutMoveNode(layout, nodeId, x, y) {", "export function layoutMoveNode(layout: import('./types.js').BlueprintLayout, nodeId: string, x: number, y: number) {"),
          ])

          patch('src/workspace/graph/viewport.ts', [
              ("export function clampZoom(zoom) {", "export function clampZoom(zoom: number): number {"),
              ("export function screenToGraph(point, viewport) {", "export function screenToGraph(point: import('../types.js').Point, viewport: import('../types.js').ViewportState): import('../types.js').Point {"),
              ("export function translateGraphPosition(startPosition, startPointer, currentPointer) {", "export function translateGraphPosition(startPosition: import('../types.js').Point, startPointer: import('../types.js').Point, currentPointer: import('../types.js').Point): import('../types.js').Point {"),
              ("export function boundsForNodePositions(nodePositions, nodeWidth = 0, nodeHeight = 0) {", "export function boundsForNodePositions(nodePositions: Record<string, import('../types.js').Point>, nodeWidth = 0, nodeHeight = 0) {"),
              ("export function zoomAroundPoint(viewport, zoom, point) {", "export function zoomAroundPoint(viewport: import('../types.js').ViewportState, zoom: number, point: import('../types.js').Point): import('../types.js').ViewportState {"),
              ("export function fitViewport(viewport, bounds, size, padding = 40) {", "export function fitViewport(viewport: import('../types.js').ViewportState, bounds: { minX: number; minY: number; maxX: number; maxY: number }, size: import('../types.js').Size, padding = 40): import('../types.js').ViewportState {"),
              ("export function centerViewport(viewport, bounds, size) {", "export function centerViewport(viewport: import('../types.js').ViewportState, bounds: { minX: number; minY: number; maxX: number; maxY: number }, size: import('../types.js').Size): import('../types.js').ViewportState {"),
          ])

          patch('src/workspace/graph/nodePlacement.ts', [
              ("export function createPlacementState() {", "export function createPlacementState(): import('../types.js').PlacementState {"),
              ("export function placementIsActive(state) {", "export function placementIsActive(state: import('../types.js').PlacementState): boolean {"),
              ("export function armPlacement(state, definitionId) {", "export function armPlacement(state: import('../types.js').PlacementState, definitionId: string) {"),
              ("export function updatePlacementPosition(state, point, viewport) {", "export function updatePlacementPosition(state: import('../types.js').PlacementState, point: import('../types.js').Point, viewport: import('../types.js').ViewportState) {"),
              ("export function graphPositionForCenteredPoint(point, viewport, nodeWidth = 0, nodeHeight = 0) {", "export function graphPositionForCenteredPoint(point: import('../types.js').Point, viewport: import('../types.js').ViewportState, nodeWidth = 0, nodeHeight = 0): import('../types.js').Point {"),
              ("export function graphPositionForViewportCenter(viewport, size, nodeWidth = 0, nodeHeight = 0) {", "export function graphPositionForViewportCenter(viewport: import('../types.js').ViewportState, size: import('../types.js').Size, nodeWidth = 0, nodeHeight = 0): import('../types.js').Point {"),
              ("export function pointerMovementExceedsThreshold(start, current, threshold =", "export function pointerMovementExceedsThreshold(start: import('../types.js').Point, current: import('../types.js').Point, threshold ="),
              ("export function cancelPlacement(state) {", "export function cancelPlacement(state: import('../types.js').PlacementState) {"),
          ])

          patch('src/simulation/materialStream.ts', [
              ("export function validateComponentMassFlowRates(rates) {", "export function validateComponentMassFlowRates(rates: Record<string, number>): void {"),
              ("function legacySolidFlow(componentMassFlowKgPerSecond, particleSizeMm, liberationClassId = 'partial') {", "function legacySolidFlow(componentMassFlowKgPerSecond: Record<string, number>, particleSizeMm: number, liberationClassId = 'partial'): import('../core/materials/types.js').SolidMaterialState {"),
              ("function refreshCachedTotalFlow(stream) {", "function refreshCachedTotalFlow(stream: import('./types.js').MaterialStream): void {"),
              ("export function clearMaterialStream(stream) {", "export function clearMaterialStream(stream: import('./types.js').MaterialStream) {"),
              ("export function totalMaterialStreamMassFlowKgPerSecond(stream) {", "export function totalMaterialStreamMassFlowKgPerSecond(stream: import('./types.js').MaterialStream): number {"),
          ])
          PY
      - name: Commit foundation pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "Type core browser object construction boundaries [ts-foundation]"
            git push origin HEAD:chatgpt/typescript-browser-conversion
          fi
