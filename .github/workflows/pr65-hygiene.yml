name: PR65 post-Rust migration hygiene

on:
  push:
    branches:
      - chatgpt/post-rust-migration-hygiene

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/post-rust-migration-hygiene

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Apply post-migration hygiene cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path('.')

          # Remove the old JavaScript apparatus profiler. Production profiling now
          # lives inside the authoritative Rust/WASM world runtime.
          dead_profiler = root / 'src/simulation/telemetry/apparatusProfiling.js'
          if dead_profiler.exists():
              dead_profiler.unlink()

          # Remove deprecated one-hop module aliases after migrating every relative
          # import/export reference to the canonical module path.
          shim_pattern = re.compile(
              r'^\s*/\*\*.*?@deprecated.*?\*/\s*'
              r'export\s+(?:\*\s+from|\{.*?\}\s+from)\s+'
              r'([\'\"])(?P<target>.+?)\1\s*;\s*$',
              re.S,
          )
          shims = {}
          for path in (root / 'src').rglob('*.js'):
              if 'src/wasm/' in path.as_posix():
                  continue
              text = path.read_text()
              match = shim_pattern.match(text)
              if not match:
                  continue
              spec = match.group('target')
              if not spec.startswith('.'):
                  continue
              target = Path(os.path.normpath(path.parent / spec))
              if not target.exists():
                  raise SystemExit(f'deprecated shim {path} targets missing file {target}')
              shims[path] = target

          def canonical_target(path):
              seen = set()
              while path in shims:
                  if path in seen:
                      raise SystemExit(f'deprecated shim cycle detected at {path}')
                  seen.add(path)
                  path = shims[path]
              return path

          for shim in list(shims):
              shims[shim] = canonical_target(shims[shim])

          quoted_relative = re.compile(r'([\'\"])(?P<spec>\.\.?/[^\'\"]+)\1')
          for path in [*root.joinpath('src').rglob('*.js'), *root.joinpath('tests').rglob('*.js')]:
              if path in shims:
                  continue
              original = path.read_text()

              def rewrite(match):
                  spec = match.group('spec')
                  resolved = Path(os.path.normpath(path.parent / spec))
                  target = shims.get(resolved)
                  if target is None:
                      return match.group(0)
                  relative = os.path.relpath(target, path.parent).replace(os.sep, '/')
                  if not relative.startswith('.'):
                      relative = './' + relative
                  quote = match.group(1)
                  return f'{quote}{relative}{quote}'

              updated = quoted_relative.sub(rewrite, original)
              if updated != original:
                  path.write_text(updated)

          for shim in shims:
              shim.unlink()

          # The browser-side apparatus registry constructs readable Blueprint nodes;
          # it is not a simulation runtime. Rename the public symbols accordingly.
          symbol_renames = {
              'APPARATUS_RUNTIME_REGISTRY': 'APPARATUS_NODE_FACTORY_REGISTRY',
              'apparatusRuntimeFor': 'apparatusNodeFactoryFor',
              'createApparatusRuntime': 'createApparatusNode',
          }
          for path in [*root.joinpath('src').rglob('*.js'), *root.joinpath('tests').rglob('*.js')]:
              if 'src/wasm/' in path.as_posix():
                  continue
              text = path.read_text()
              for old, new in symbol_renames.items():
                  text = text.replace(old, new)
              path.write_text(text)

          registry = root / 'src/simulation/apparatus/registry.js'
          registry_text = registry.read_text()
          registry_text = registry_text.replace("Unknown apparatus runtime '${nodeType}'", "Unknown apparatus node type '${nodeType}'")
          registry.write_text(registry_text)

          architecture_performance = r'''# Project Interlink realtime browser runtime architecture

This document describes the current production runtime. Historical migration notes belong in `PATCH_NOTES.md` and Git history rather than in the active architecture contract.

## Runtime authority

Project Interlink uses a single authoritative physical simulation:

```text
browser main thread
  Blueprint/world authoring state
  DOM / graph / Inspector / input
  realtime pacing and presentation
             |
             | versioned commands + compact snapshots/detail queries
             v
simulation Web Worker
             |
             v
WasmPackedWorldRuntime
             |
             v
platform-neutral Rust crates
  scheduling / routing / material state
  apparatus / thermal / chemistry
  conservation / world boundaries
```

JavaScript does not advance physical time, own retained physical state, or provide a fallback physics engine. Browsers without Web Worker and WebAssembly support are unsupported rather than silently selecting a second implementation.

The authoritative physics step is `0.1 s`. Pause/resume changes whether fixed steps advance; it does not switch to batch, event, or fast-forward semantics.

## Layer responsibilities

### Browser presentation and authoring

JavaScript owns the readable Blueprint/world representation, editing, persistence-oriented identifiers, DOM/UI, graph interaction, navigation, Inspector presentation, and runtime setup compilation. These objects are convenient authoring state, not a second physical world.

Transient `runtimePresentation` projections may cache Worker snapshots on browser objects for graph cards and Inspector display. They are non-authoritative and must be discarded/rebuilt when the runtime is replaced.

### Worker protocol and pacing

`src/simulation/realtimeRuntime.js` performs wall-clock accumulation and issues fixed-step work to the dedicated Worker. `src/simulation/runtimeProtocol.js` defines the versioned command/event boundary. Commands are correlated with request IDs; snapshot and detail responses are projections of Worker-owned state.

The main thread must never run a compensating simulation step when the Worker is busy. Realtime factor and backlog are consequences of actual completed Worker steps.

### Rust/WASM execution

`rust/interlink-runtime` owns the complete packed execution graph, world clock, Site ordering, retained inventories, apparatus state, routing, boundary transfers, and fixed-step schedule. Domain crates own their numerical behavior. `rust/interlink-wasm` is the browser adapter; the production entry point is `WasmPackedWorldRuntime`.

Canonical string IDs remain in content/save/authoring state. Setup compilers assign runtime-local numeric IDs and packed columns for execution. Runtime numeric IDs are never persistent game identity.

## Setup and reconfiguration boundary

JavaScript setup compilers convert canonical world/content data into bulk initialization calls for the Worker-owned WASM runtime. Normal physical execution then remains inside Rust/WASM. The architecture explicitly rejects per-fraction or per-apparatus JS↔WASM calls in the fixed-step hot path.

Topology and parameter edits use explicit reconfiguration commands. Reconfiguration must be transactional: an invalid edit may fail, but it must not leave a partially mutated authoritative runtime.

## Presentation contract

Presentation work is dirty/revision driven. Graph and Inspector views consume compact scalar snapshots and selected-node detail queries rather than cloning the complete runtime state each frame.

Detailed material composition, particle-size distribution, liberation state, furnace-zone state, and temperature are queried only when needed. Temperature is derived from authoritative energy and composition-dependent heat capacity; presentation must not invent an independently mutable temperature state.

## Performance telemetry

Production telemetry must describe measured behavior, not estimates presented as measurements. Worker messages report completed fixed steps and measured Rust/WASM tick timing. Browser telemetry may additionally report display frame timing, presentation cost, backlog, and heap information where the platform exposes it.

Deep per-apparatus profiling is an opt-in Rust/WASM mode because instrumentation itself has overhead. JavaScript must not wrap or time a non-existent browser-side apparatus simulation path.

## CPU parallelism

Additional Worker or WASM-thread parallelism should be introduced only for genuinely independent work with deterministic synchronization boundaries. Candidate workloads include independent Site components, generation batches, Monte Carlo work, or large regular material transforms.

Shared-memory WASM threading requires cross-origin isolation and should only be introduced when packed workloads are large enough to justify the deployment and synchronization cost.

## WebGPU policy

WebGPU is a selective numerical backend, not a replacement for the Rust world scheduler. Small apparatus graphs are branch-heavy and dependency-heavy and generally remain CPU workloads.

GPU compute is appropriate when the workload becomes large and regular, for example:

- planetary/geological fields;
- large heat, diffusion, erosion, fluid, voxel, or cellular grids;
- high-volume property/reaction evaluation over homogeneous arrays;
- Monte Carlo or matrix-style numerical batches.

A GPU path must demonstrate a measured benefit after transfer and synchronization costs.

## Deployment

The application remains compatible with static hosting for its current Worker/WASM runtime. Shared-memory threading would require a host capable of supplying COOP/COEP headers for cross-origin isolation.

## Performance acceptance criteria

Representative benchmarks should include multiple factory sizes such as 1, 10, 25, 50, and 100 lines and record at least:

- display FPS / frame average / frame p95;
- measured Rust/WASM physics time per completed fixed step;
- presentation CPU time;
- realtime factor;
- simulation backlog/debt;
- JS heap where available;
- material population count;
- per-apparatus hotspots when deep profiling is enabled.

The primary scaling target is realtime factor near `1.0x` while preserving responsive presentation on weaker hardware, not maximum FPS on a high-end desktop.

## Architectural invariants

The following are deliberate constraints:

1. There is one physical authority: Worker-owned Rust/WASM.
2. JavaScript authoring objects and presentation projections are never independently advanced physical state.
3. No full-world structured clone occurs every physics step.
4. No per-fraction bridge loop is added to the normal fixed-step path.
5. Fixed-step ordering and conservation semantics remain deterministic.
6. Runtime-local numeric IDs are never serialized as content identity.
7. GPU/threading work is introduced only for measured workloads that benefit from it.
8. Unsupported browsers fail explicitly rather than selecting a hidden JavaScript physics fallback.
'''

          rust_readme = r'''# Rust / WebAssembly simulation runtime

Project Interlink's production physical simulation is owned by platform-neutral Rust compiled to WebAssembly and executed in a dedicated browser Worker.

JavaScript remains responsible for authoring, UI, persistence-oriented structures, setup compilation, Worker messaging, and presentation. It does not advance physical time or maintain a fallback physical simulation.

## Crates

- `interlink-core` — packed material/storage primitives and conservation-sensitive transfers.
- `interlink-processes` — reusable process and continuous-stream machinery.
- `interlink-routing` — deterministic multi-port routing and thermal-aware mixing.
- `interlink-comminution` — Crusher/Jaw/Cone/Ball-Mill particle-size, liberation, energy, and abrasion behavior.
- `interlink-separation` — Screen and Magnetic Separator conservative partitioning.
- `interlink-extraction` — ResourceOccurrence and Extractor execution.
- `interlink-thermal` — packed gas and sensible-thermal behavior.
- `interlink-thermochemistry` — reaction execution and thermochemical energy closure.
- `interlink-roasting` — retained-zone Roasting Furnace runtime.
- `interlink-runtime` — complete world graph ownership and deterministic fixed-step scheduling.
- `interlink-wasm` — `wasm-bindgen` browser adapter.

All domain crates are browser-independent and can be used by native tests, headless tooling, or future frontends.

## Production ownership

The production path is:

```text
canonical JavaScript world/content
        |
        | bulk setup/reconfigure compilation
        v
Web Worker
        |
        v
WasmPackedWorldRuntime
        |
        v
PackedWorldRuntime
        |
        +-- packed inventories and streams
        +-- apparatus state
        +-- routing and boundaries
        +-- thermal / chemistry
        +-- deterministic 0.1 s scheduler
```

The Worker remains the sole owner of retained physical execution state between steps. Browser-side snapshots are presentation data only.

`interlink-wasm` still contains some standalone coarse adapter types that were useful while individual domains were being introduced. They are not the production scheduler and must not be used to establish a second authoritative runtime. The production browser entry point is `WasmPackedWorldRuntime`.

## Packed execution state

Solid particulate state uses structure-of-arrays columns:

```text
species_id[]            u16
size_bin_id[]           u8
liberation_class_id[]   u8
texture_profile_id[]    u32
quantity[]              f64
```

Packed gas state uses:

```text
species_id[]            u16
quantity[]              f64
```

Gas-body quantities are kg; gas-stream quantities are kg/s. Sensible enthalpy is an authoritative scalar on the owning body/stream. Temperature is derived from energy and composition-dependent heat capacity.

Runtime-local numeric IDs are execution details only. Canonical string IDs remain the content/save identity.

## JavaScript setup compilers

The `src/simulation/packed*Compiler.js` modules are canonical-state → Rust-runtime setup compilers. They may use temporary typed arrays or setup-only JavaScript objects to assemble bulk runtime input. Those structures are not a JavaScript physics engine and are not advanced each fixed step.

Setup compilers provide one shared numeric identity space for material species, size bins, liberation classes, texture profiles, thermal properties, apparatus metadata, reaction tables, occurrences, topology, and retained import state.

## World runtime

`interlink-runtime` owns the complete execution graph rather than invoking isolated apparatus wrappers from JavaScript. It owns:

- world clock and pause state;
- Site registration and deterministic ordering;
- Hoppers and Exhaust Vents;
- ResourceOccurrences;
- apparatus runtimes;
- direct Feeder → Furnace and Furnace → Furnace staging;
- Site-local and world boundary transfers;
- shared material/property tables;
- transactional live reconfiguration;
- opt-in measured profiling.

Normal fixed-step execution occurs through coarse world-runtime calls. Material populations do not cross the JS/WASM boundary for each apparatus or fraction.

## Browser protocol

The dedicated Worker initializes WASM, owns `WasmPackedWorldRuntime`, and processes the versioned runtime protocol. The main thread sends commands such as initialize, reconfigure, pause/resume, fixed-step advancement, and selected detail queries. It receives compact snapshots, detail responses, profiling data, and errors.

A failed non-terminal detail query must not destroy the authoritative runtime. Invalid reconfiguration must not partially mutate it.

## Conservation and determinism rules

1. All participating inventories in multi-output operations commit atomically.
2. Fixed-step ordering remains deterministic.
3. Mass and sensible energy are conserved according to each process contract.
4. Temperature is derived from the authoritative energy ledger.
5. Qualitative generation labels are not reinterpreted as physical reserve mass.
6. Gas pressure/volume/phase state is not added without an explicit gameplay and conservation contract.
7. Runtime numeric IDs are never serialized as game identity.
8. Browser presentation never becomes a second source of physical truth.

## Commands

From the repository root:

```bash
cargo test --workspace
cargo check -p interlink-wasm --target wasm32-unknown-unknown
npm run check:runtime
```

The repository pins stable Rust and the `wasm32-unknown-unknown` target in `rust-toolchain.toml`.

## Historical notes

The repository was converted incrementally from a JavaScript-authoritative simulation to the current Rust/WASM Worker architecture. That history remains useful for archaeology and parity rationale, but it is not the active runtime contract. Use `PATCH_NOTES.md`, merged pull requests, and Git history for the chronological migration record.
'''

          runtime_readme = r'''# interlink-runtime

`interlink-runtime` is the platform-neutral conductor for Project Interlink's authoritative packed Rust simulation. It owns a complete world execution graph and deliberately contains no DOM, Worker, `wasm-bindgen`, or browser code.

## Ownership

A `PackedWorldRuntime` owns:

- the world simulation clock and pause/resume state;
- registered Site runtimes and elapsed/extraction statistics;
- packed Hopper inventories;
- packed ResourceOccurrence sources;
- Exhaust Vent gas inventories;
- all active apparatus runtimes;
- shared thermal, comminution, separation, and thermochemical property tables;
- Site-local passive boundary-buffer transfers;
- world-level boundary transfers;
- live reconfiguration of the packed graph;
- optional measured profiling of completed ticks and apparatus execution.

Runtime numeric IDs are execution-local. Canonical string IDs remain outside this crate and are compiled into numeric IDs during setup.

## Deterministic fixed-step order

The scheduler preserves the established production ordering:

```text
for each registered Site, in registration order:
  Extractor             phase 10
  Material Merger       phase 15
  Feeder                phase 18
  Legacy Crusher / Jaw  phase 20
  Cone Crusher          phase 22
  Ball Mill             phase 24
  Screen                phase 30
  Splitter              phase 35
  Magnetic Separator    phase 40
  Roasting Furnace      phase 45

  Site-local passive Hopper transfers

world boundary transfers, ordered by priority then canonical transfer order

advance world clock
```

Within a phase, canonical node insertion order is retained through a numeric ordinal. The authoritative fixed step is `0.1 s` through `tick_fixed()`.

## Cross-apparatus ownership

Most machines operate directly on Rust-owned Hopper state. Valid production edges that do not require an intermediate Hopper are handled inside the scheduler, including:

- Feeder → Roasting Furnace;
- Roasting Furnace → Roasting Furnace.

These paths use staged Rust-owned transactions. No material populations are routed through JavaScript during execution.

## Site and world boundaries

Site-local explicit boundary-buffer links execute after apparatus phases for that Site. World transfers execute after all Sites have advanced for the tick and remain deterministic by transfer priority and canonical order.

## State import and live reconfiguration

Browser setup compilers provide the runtime with a complete packed initialization snapshot, including retained inventories, clocks, statistics, furnace state, topology, and property tables required by the current world.

Live topology/parameter changes are applied through explicit reconfiguration. Reconfiguration must preserve existing retained physical state where appropriate and must fail transactionally when an edit is invalid.

## Profiling

The runtime provides opt-in profiling that measures completed Rust/WASM tick duration and per-apparatus execution time. Profiling is observational only: simulation behavior must never depend on timing output. Disabled profiling should avoid deep per-node instrumentation overhead.

## Browser boundary

`WasmPackedWorldRuntime` in `interlink-wasm` is the production browser adapter. The Worker owns that object and advances the complete graph through coarse calls. Browser code receives compact snapshots and selected detail queries rather than synchronizing the complete physical world each step.

The browser-side Blueprint is an authoring/persistence representation. It is not an independently advanced simulation.

## Validation priorities

Tests should continue to pin:

- exact apparatus phase ordering;
- same-phase insertion ordering;
- same-tick propagation behavior;
- all-Sites-before-world-boundary timing;
- pause semantics;
- Site passive transfer timing;
- direct Feeder → Furnace and Furnace → Furnace staging;
- state import and transactional reconfiguration;
- packed compiler ID/topology behavior;
- unsupported Extractor forms remaining explicit rather than receiving dangling IDs;
- mass and sensible-energy conservation;
- profiling remaining observational;
- `wasm32-unknown-unknown` compatibility through the adapter crate.
'''

          (root / 'ARCHITECTURE_PERFORMANCE.md').write_text(architecture_performance)
          (root / 'rust/README.md').write_text(rust_readme)
          (root / 'rust/interlink-runtime/README.md').write_text(runtime_readme)

          hygiene_test = r'''import test from 'node:test';
import assert from 'node:assert/strict';
import fs from 'node:fs';
import path from 'node:path';
import { fileURLToPath } from 'node:url';

const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), '..');

function walkJs(relativeRoot) {
  const start = path.join(root, relativeRoot);
  const files = [];
  const visit = current => {
    for (const entry of fs.readdirSync(current, { withFileTypes: true })) {
      const absolute = path.join(current, entry.name);
      if (entry.isDirectory()) visit(absolute);
      else if (entry.isFile() && entry.name.endsWith('.js')) files.push(absolute);
    }
  };
  visit(start);
  return files;
}

function repoRelative(absolute) {
  return path.relative(root, absolute).replaceAll(path.sep, '/');
}

test('post-migration JavaScript contains no deprecated single-hop re-export shims', () => {
  const shimPattern = /@deprecated[\s\S]*?export\s+(?:\*\s+from|\{[\s\S]*?\}\s+from)\s+['"]\.\.?\//;
  const offenders = walkJs('src')
    .filter(file => !repoRelative(file).startsWith('src/wasm/'))
    .filter(file => shimPattern.test(fs.readFileSync(file, 'utf8')))
    .map(repoRelative);
  assert.deepEqual(offenders, []);
});

test('all source and test relative JavaScript module references resolve', () => {
  const specifierPattern = /['"](?<specifier>\.\.?\/[^'"]+\.js)['"]/g;
  const missing = [];
  for (const file of [...walkJs('src'), ...walkJs('tests')]) {
    const text = fs.readFileSync(file, 'utf8');
    for (const match of text.matchAll(specifierPattern)) {
      const resolved = path.resolve(path.dirname(file), match.groups.specifier);
      if (!fs.existsSync(resolved)) missing.push(`${repoRelative(file)} -> ${match.groups.specifier}`);
    }
  }
  assert.deepEqual(missing, []);
});

test('browser apparatus factory terminology does not imply a JavaScript simulation runtime', () => {
  const forbidden = /APPARATUS_RUNTIME_REGISTRY|apparatusRuntimeFor|createApparatusRuntime/;
  const offenders = walkJs('src')
    .filter(file => !repoRelative(file).startsWith('src/wasm/'))
    .filter(file => forbidden.test(fs.readFileSync(file, 'utf8')))
    .map(repoRelative);
  assert.deepEqual(offenders, []);
});

test('obsolete JavaScript apparatus profiler is gone', () => {
  assert.equal(fs.existsSync(path.join(root, 'src/simulation/telemetry/apparatusProfiling.js')), false);
});

test('active architecture docs cannot regress to pre-cutover authority claims', () => {
  const docs = [
    'ARCHITECTURE_PERFORMANCE.md',
    'rust/README.md',
    'rust/interlink-runtime/README.md',
  ];
  const forbidden = [
    'JavaScript simulation remains production-authoritative',
    'JavaScript engine remains authoritative',
    'compiled JavaScript execution backend as the selectable production path',
    'What this PR does not cut over',
  ];
  for (const doc of docs) {
    const text = fs.readFileSync(path.join(root, doc), 'utf8');
    for (const phrase of forbidden) assert.equal(text.includes(phrase), false, `${doc} contains stale phrase: ${phrase}`);
    assert.match(text, /Rust\/WASM|Rust simulation|Rust crates/);
  }
});
'''
          (root / 'tests/postMigrationHygiene.test.js').write_text(hygiene_test)

          print('Removed deprecated shims:')
          for shim, target in sorted(shims.items(), key=lambda item: item[0].as_posix()):
              print(f'  {shim} -> {target}')
          PY

      - name: Verify no obsolete JavaScript authority artifacts remain
        shell: bash
        run: |
          test ! -e src/simulation/telemetry/apparatusProfiling.js
          ! grep -R -n --include='*.js' -E 'APPARATUS_RUNTIME_REGISTRY|apparatusRuntimeFor|createApparatusRuntime' src --exclude-dir=wasm
          ! grep -R -n -F 'JavaScript simulation remains production-authoritative' ARCHITECTURE_PERFORMANCE.md rust/README.md rust/interlink-runtime/README.md
          ! grep -R -n -F 'JavaScript engine remains authoritative' ARCHITECTURE_PERFORMANCE.md rust/README.md rust/interlink-runtime/README.md

      - name: Run JavaScript and Rust/WASM validation
        run: npm run check:runtime

      - name: Collapse branch to one reviewable commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/pr65-hygiene.yml
          git add -A
          git reset --soft origin/main
          git add -A
          git commit -m 'Clean post-Rust migration artifacts'
          git push --force-with-lease origin HEAD:chatgpt/post-rust-migration-hygiene
