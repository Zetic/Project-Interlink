name: PR65 post-Rust migration hygiene

on:
  push:
    branches:
      - chatgpt/post-rust-migration-hygiene

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/post-rust-migration-hygiene

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Apply cleanup
        run: python3 scripts/pr65_hygiene.py

      - name: Verify cleanup guards
        run: |
          test ! -e src/simulation/telemetry/apparatusProfiling.js
          if grep -R -n --include='*.js' -E 'APPARATUS_RUNTIME_REGISTRY|apparatusRuntimeFor|createApparatusRuntime' src --exclude-dir=wasm; then exit 1; fi
          if grep -R -n -F 'JavaScript simulation remains production-authoritative' ARCHITECTURE_PERFORMANCE.md rust/README.md rust/interlink-runtime/README.md; then exit 1; fi
          if grep -R -n -F 'JavaScript engine remains authoritative' ARCHITECTURE_PERFORMANCE.md rust/README.md rust/interlink-runtime/README.md; then exit 1; fi

      - name: Run runtime validation
        run: npm run check:runtime

      - name: Collapse branch to one reviewable commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/pr65-hygiene.yml scripts/pr65_hygiene.py
          git add -A
          git reset --soft origin/main
          git add -A
          git commit -m 'Clean post-Rust migration artifacts'
          git push --force-with-lease origin HEAD:chatgpt/post-rust-migration-hygiene
