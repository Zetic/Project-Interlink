name: TypeScript Migration Experiment

on:
  push:
    branches: [chatgpt/typescript-browser-conversion]

permissions:
  contents: write

jobs:
  experiment:
    if: ${{ !contains(github.event.head_commit.message, '[ts-experiment]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/typescript-browser-conversion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run ts-migrate on throwaway working tree
        run: |
          set +e
          npm install --no-save ts-migrate > /tmp/install.log 2>&1
          INSTALL_EXIT=$?
          npx ts-migrate-full src > /tmp/migrate.log 2>&1
          MIGRATE_EXIT=$?
          npx tsc --noEmit -p tsconfig.json > /tmp/tsc.log 2>&1
          TSC_EXIT=$?
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = '\n'.join(p.read_text(errors='ignore') for p in Path('src').rglob('*.ts'))
          tsc = Path('/tmp/tsc.log').read_text(errors='ignore')
          errors = re.findall(r'error (TS\d+):', tsc)
          out = [
              f"explicit_any_tokens={len(re.findall(r'\\bany\\b', src))}",
              f"ts_expect_error={src.count('@ts-expect-error')}",
              f"ts_ignore={src.count('@ts-ignore')}",
              f"ts_nocheck={src.count('@ts-nocheck')}",
              f"remaining_tsc_errors={len(errors)}",
              '',
              'ts-migrate output tail:',
              '\n'.join(Path('/tmp/migrate.log').read_text(errors='ignore').splitlines()[-80:]),
              '',
              'tsc output head:',
              '\n'.join(tsc.splitlines()[:120]),
          ]
          Path('/tmp/typescript-migrate-experiment.txt').write_text('\n'.join(out) + '\n')
          PY
          git reset --hard HEAD
          cp /tmp/typescript-migrate-experiment.txt .
          echo "INSTALL_EXIT=$INSTALL_EXIT" >> typescript-migrate-experiment.txt
          echo "MIGRATE_EXIT=$MIGRATE_EXIT" >> typescript-migrate-experiment.txt
          echo "TSC_EXIT=$TSC_EXIT" >> typescript-migrate-experiment.txt
          exit 0
      - name: Commit experiment report only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typescript-migrate-experiment.txt
          git commit -m "Measure automated TypeScript migration quality [ts-experiment]"
          git push origin HEAD:chatgpt/typescript-browser-conversion
