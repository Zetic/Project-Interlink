name: TypeScript Conversion Pass

on:
  push:
    branches: [chatgpt/typescript-browser-conversion]

permissions:
  contents: write

jobs:
  pass:
    if: ${{ !contains(github.event.head_commit.message, '[ts-pass]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/typescript-browser-conversion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Fix source-inspection test paths after extension conversion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          existing = {p.as_posix() for p in Path('src').rglob('*.ts')}
          pattern = re.compile(r"(?P<q>['\"])(?P<path>src/[^'\"]+\.js)(?P=q)")
          for test in Path('tests').rglob('*.ts'):
              lines = test.read_text().splitlines(keepends=True)
              changed = []
              for line in lines:
                  stripped = line.lstrip()
                  if stripped.startswith('import ') or ' from ' in line:
                      changed.append(line)
                      continue
                  def repl(match):
                      old = match.group('path')
                      candidate = old[:-3] + '.ts'
                      if candidate in existing:
                          return f"{match.group('q')}{candidate}{match.group('q')}"
                      return match.group(0)
                  changed.append(pattern.sub(repl, line))
              test.write_text(''.join(changed))
          PY

      - name: Produce relaxed diagnostic summary
        run: |
          set +e
          npx tsc --noEmit -p tsconfig.json --noImplicitAny false > typescript-relaxed-diagnostics.txt 2>&1
          RELAXED_EXIT=$?
          npm test > typescript-tests.txt 2>&1
          TEST_EXIT=$?
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re

          text = Path('typescript-relaxed-diagnostics.txt').read_text()
          errors = re.findall(r'^(.*?\.ts)\((\d+),(\d+)\): error (TS\d+):', text, re.M)
          by_file = Counter(e[0] for e in errors)
          by_code = Counter(e[3] for e in errors)
          out = [f'errors={len(errors)}', '', 'By code:']
          out += [f'{code}: {count}' for code, count in by_code.most_common()]
          out += ['', 'By file:']
          out += [f'{path}: {count}' for path, count in by_file.most_common()]
          Path('typescript-error-summary.txt').write_text('\n'.join(out) + '\n')
          PY
          echo "RELAXED_EXIT=$RELAXED_EXIT" >> typescript-error-summary.txt
          echo "TEST_EXIT=$TEST_EXIT" >> typescript-error-summary.txt
          exit 0

      - name: Commit diagnostic pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests typescript-relaxed-diagnostics.txt typescript-tests.txt typescript-error-summary.txt
          if ! git diff --cached --quiet; then
            git commit -m "Measure TypeScript conversion blockers [ts-pass]"
            git push origin HEAD:chatgpt/typescript-browser-conversion
          fi
