name: Apply Phase 4 map smoothness fixes

on:
  push:
    branches:
      - phase-4-map-rendering-smoothness
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-map-rendering-smoothness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source changes
        run: python .github/scripts/apply_phase4_map_smoothness.py
      - name: Remove one-time staging files
        run: |
          rm -f .github/scripts/apply_phase4_map_smoothness.py
          rm -f .github/workflows/phase4-map-smoothness-apply.yml
      - name: Install dependencies
        run: npm install
      - name: Remove incidental lockfile
        run: rm -f package-lock.json
      - name: Build TypeScript browser modules
        run: npm run build
      - name: Run JavaScript regression tests
        run: npm test
      - name: Commit implementation and generated dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Smooth engineering map zoom and node visibility"
          git push origin HEAD:phase-4-map-rendering-smoothness
