name: WG-3.75 Integration Sync

on:
  push:
    branches: [worldgen-rewrite-wg3-75-multires-parameters]

permissions:
  contents: write

concurrency:
  group: wg375-integration-sync
  cancel-in-progress: true

jobs:
  integrate-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldgen-rewrite-wg3-75-multires-parameters
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Implement physical inheritance bundle and diagnostics
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          path = Path('rust/interlink-worldgen/src/refinement.rs')
          text = path.read_text()
          text = text.replace(
              'use crate::{expected_sample_count, GeodesicTopology, WorldgenError};',
              'use crate::{expected_sample_count, CrustalModel, GeodesicTopology, LithosphericModel, PlanetPhysicalParameters, TectonicModel, WorldgenError};'
          )

          anchor = '#[cfg(test)]\nmod tests {'
          addition = r'''
          pub fn refine_scalar_f32_with_domains(
              fine_topology: &GeodesicTopology,
              coarse_level: u8,
              coarse_values: &[f32],
              map: &RefinementMap,
              coarse_domains: &[u16],
          ) -> Result<Vec<f32>, WorldgenError> {
              let coarse_count = validate_scalar_len(fine_topology, coarse_level, coarse_values)?;
              if map.metrics.coarse_level != coarse_level || map.metrics.fine_level != fine_topology.level() {
                  return Err(WorldgenError::InvalidRefinement("refinement map does not match scalar refinement levels"));
              }
              if coarse_domains.len() != coarse_count as usize {
                  return Err(WorldgenError::InvalidRefinement("coarse domain field length does not match coarse topology"));
              }
              if coarse_values.iter().any(|value| !value.is_finite()) {
                  return Err(WorldgenError::InvalidRefinement("coarse scalar field contains non-finite values"));
              }
              let domains = refine_categorical_u16(map, coarse_domains)?;
              let mut output = vec![0.0_f32; fine_topology.metrics().sample_count as usize];
              output[..coarse_count as usize].copy_from_slice(coarse_values);
              for sample in coarse_count as usize..output.len() {
                  let [a, b] = fine_topology.parent_edges()[sample];
                  if a == u32::MAX || b == u32::MAX || a as usize >= sample || b as usize >= sample {
                      return Err(WorldgenError::InvalidRefinement("fine sample has invalid hierarchical parents"));
                  }
                  let target_domain = domains[sample];
                  let a_matches = domains[a as usize] == target_domain;
                  let b_matches = domains[b as usize] == target_domain;
                  output[sample] = match (a_matches, b_matches) {
                      (true, true) => (output[a as usize] + output[b as usize]) * 0.5,
                      (true, false) => output[a as usize],
                      (false, true) => output[b as usize],
                      (false, false) => coarse_values[map.nearest_coarse_source[sample] as usize],
                  };
              }
              Ok(output)
          }

          #[derive(Clone, Debug, PartialEq)]
          pub struct InheritedPhysicalState {
              pub map: RefinementMap,
              pub parameter_hash: u64,
              pub inheritance_hash: u64,
              pub plate_ids: Vec<u16>,
              pub crust_kind: Vec<u8>,
              pub crust_province_id: Vec<u16>,
              pub crust_age_myr: Vec<f32>,
              pub crust_thickness_km: Vec<f32>,
              pub crust_density_kg_per_m3: Vec<f32>,
              pub buoyancy_index: Vec<f32>,
              pub orogenic_history: Vec<f32>,
              pub rift_history: Vec<f32>,
              pub ridge_history: Vec<f32>,
              pub subduction_history: Vec<f32>,
              pub trench_history: Vec<f32>,
              pub volcanic_arc_history: Vec<f32>,
              pub transform_history: Vec<f32>,
              pub subsidence_history: Vec<f32>,
              pub basin_potential: Vec<f32>,
              pub crustal_strain: Vec<f32>,
              pub strength_index: Vec<f32>,
              pub weakness_index: Vec<f32>,
              pub effective_elastic_thickness_km: Vec<f32>,
              pub thermal_anomaly_index: Vec<f32>,
              pub mantle_upwelling_index: Vec<f32>,
              pub mantle_dynamic_support_index: Vec<f32>,
              pub compensated_buoyancy_index: Vec<f32>,
              pub structural_fabric_strength: Vec<f32>,
              pub structural_zone_kind: Vec<u8>,
              pub fragmentation_propensity: Vec<f32>,
              pub fragment_ids: Vec<u16>,
              pub kinematic_domain_ids: Vec<u16>,
          }

          impl InheritedPhysicalState {
              pub fn inheritance_hash_hex(&self) -> String { format!("{:016x}", self.inheritance_hash) }
              pub fn parameter_hash_hex(&self) -> String { format!("{:016x}", self.parameter_hash) }
          }

          fn validate_upstream_lengths(
              coarse_count: usize,
              tectonics: &TectonicModel,
              geology: &CrustalModel,
              lithosphere: &LithosphericModel,
          ) -> Result<(), WorldgenError> {
              let geology_lengths = [
                  geology.crust_kind.len(), geology.crust_province_id.len(), geology.crust_age_myr.len(),
                  geology.crust_thickness_km.len(), geology.crust_density_kg_per_m3.len(), geology.buoyancy_index.len(),
                  geology.orogenic_history.len(), geology.rift_history.len(), geology.ridge_history.len(),
                  geology.subduction_history.len(), geology.trench_history.len(), geology.volcanic_arc_history.len(),
                  geology.transform_history.len(), geology.subsidence_history.len(), geology.basin_potential.len(),
                  geology.crustal_strain.len(),
              ];
              let lithosphere_lengths = [
                  lithosphere.strength_index.len(), lithosphere.weakness_index.len(),
                  lithosphere.effective_elastic_thickness_km.len(), lithosphere.thermal_anomaly_index.len(),
                  lithosphere.mantle_upwelling_index.len(), lithosphere.mantle_dynamic_support_index.len(),
                  lithosphere.compensated_buoyancy_index.len(), lithosphere.structural_fabric_strength.len(),
                  lithosphere.structural_zone_kind.len(), lithosphere.fragmentation_propensity.len(),
                  lithosphere.fragment_ids.len(), lithosphere.kinematic_domain_ids.len(),
              ];
              if tectonics.plate_ids.len() != coarse_count
                  || geology_lengths.iter().any(|length| *length != coarse_count)
                  || lithosphere_lengths.iter().any(|length| *length != coarse_count)
              {
                  return Err(WorldgenError::InvalidRefinement("upstream physical state does not match the declared coarse topology"));
              }
              Ok(())
          }

          pub fn inherit_physical_state(
              fine_topology: &GeodesicTopology,
              coarse_level: u8,
              tectonics: &TectonicModel,
              geology: &CrustalModel,
              lithosphere: &LithosphericModel,
              parameters: PlanetPhysicalParameters,
          ) -> Result<InheritedPhysicalState, WorldgenError> {
              parameters.validate().map_err(WorldgenError::InvalidParameters)?;
              let coarse_count = validate_levels(fine_topology, coarse_level)? as usize;
              validate_upstream_lengths(coarse_count, tectonics, geology, lithosphere)?;
              let map = build_refinement_map(fine_topology, coarse_level)?;

              let plate_ids = refine_categorical_u16(&map, &tectonics.plate_ids)?;
              let crust_kind = refine_categorical_u8(&map, &geology.crust_kind)?;
              let crust_province_id = refine_categorical_u16(&map, &geology.crust_province_id)?;
              let fragment_ids = refine_categorical_u16(&map, &lithosphere.fragment_ids)?;
              let kinematic_domain_ids = refine_categorical_u16(&map, &lithosphere.kinematic_domain_ids)?;
              let structural_zone_kind = refine_categorical_u8(&map, &lithosphere.structural_zone_kind)?;

              let crust_age_myr = refine_scalar_f32_with_domains(fine_topology, coarse_level, &geology.crust_age_myr, &map, &geology.crust_province_id)?;
              let crust_thickness_km = refine_scalar_f32_with_domains(fine_topology, coarse_level, &geology.crust_thickness_km, &map, &geology.crust_province_id)?;
              let crust_density_kg_per_m3 = refine_scalar_f32_with_domains(fine_topology, coarse_level, &geology.crust_density_kg_per_m3, &map, &geology.crust_province_id)?;
              let buoyancy_index = refine_scalar_f32_with_domains(fine_topology, coarse_level, &geology.buoyancy_index, &map, &geology.crust_province_id)?;

              let orogenic_history = refine_scalar_f32(fine_topology, coarse_level, &geology.orogenic_history)?;
              let rift_history = refine_scalar_f32(fine_topology, coarse_level, &geology.rift_history)?;
              let ridge_history = refine_scalar_f32(fine_topology, coarse_level, &geology.ridge_history)?;
              let subduction_history = refine_scalar_f32(fine_topology, coarse_level, &geology.subduction_history)?;
              let trench_history = refine_scalar_f32(fine_topology, coarse_level, &geology.trench_history)?;
              let volcanic_arc_history = refine_scalar_f32(fine_topology, coarse_level, &geology.volcanic_arc_history)?;
              let transform_history = refine_scalar_f32(fine_topology, coarse_level, &geology.transform_history)?;
              let subsidence_history = refine_scalar_f32(fine_topology, coarse_level, &geology.subsidence_history)?;
              let basin_potential = refine_scalar_f32(fine_topology, coarse_level, &geology.basin_potential)?;
              let crustal_strain = refine_scalar_f32(fine_topology, coarse_level, &geology.crustal_strain)?;

              let strength_index = refine_scalar_f32_with_domains(fine_topology, coarse_level, &lithosphere.strength_index, &map, &lithosphere.kinematic_domain_ids)?;
              let weakness_index = refine_scalar_f32_with_domains(fine_topology, coarse_level, &lithosphere.weakness_index, &map, &lithosphere.kinematic_domain_ids)?;
              let effective_elastic_thickness_km = refine_scalar_f32_with_domains(fine_topology, coarse_level, &lithosphere.effective_elastic_thickness_km, &map, &lithosphere.kinematic_domain_ids)?;
              let structural_fabric_strength = refine_scalar_f32_with_domains(fine_topology, coarse_level, &lithosphere.structural_fabric_strength, &map, &lithosphere.kinematic_domain_ids)?;
              let fragmentation_propensity = refine_scalar_f32_with_domains(fine_topology, coarse_level, &lithosphere.fragmentation_propensity, &map, &lithosphere.kinematic_domain_ids)?;

              let thermal_anomaly_index = refine_scalar_f32(fine_topology, coarse_level, &lithosphere.thermal_anomaly_index)?;
              let mantle_upwelling_index = refine_scalar_f32(fine_topology, coarse_level, &lithosphere.mantle_upwelling_index)?;
              let mantle_dynamic_support_index = refine_scalar_f32(fine_topology, coarse_level, &lithosphere.mantle_dynamic_support_index)?;
              let compensated_buoyancy_index = refine_scalar_f32_with_domains(fine_topology, coarse_level, &lithosphere.compensated_buoyancy_index, &map, &geology.crust_province_id)?;

              let parameter_hash = parameters.parameter_hash();
              let mut inheritance_hash = FNV_OFFSET_BASIS;
              inheritance_hash = fnv_update(inheritance_hash, MULTIRES_STAGE_ID.as_bytes());
              inheritance_hash = fnv_update(inheritance_hash, &MULTIRES_STAGE_VERSION.to_le_bytes());
              inheritance_hash = fnv_update(inheritance_hash, &map.metrics.provenance_hash.to_le_bytes());
              inheritance_hash = fnv_update(inheritance_hash, &parameter_hash.to_le_bytes());
              inheritance_hash = fnv_update(inheritance_hash, &tectonics.metrics.tectonic_hash.to_le_bytes());
              inheritance_hash = fnv_update(inheritance_hash, &geology.metrics.geology_hash.to_le_bytes());
              inheritance_hash = fnv_update(inheritance_hash, &lithosphere.metrics.lithosphere_hash.to_le_bytes());

              Ok(InheritedPhysicalState {
                  map, parameter_hash, inheritance_hash, plate_ids, crust_kind, crust_province_id,
                  crust_age_myr, crust_thickness_km, crust_density_kg_per_m3, buoyancy_index,
                  orogenic_history, rift_history, ridge_history, subduction_history, trench_history,
                  volcanic_arc_history, transform_history, subsidence_history, basin_potential, crustal_strain,
                  strength_index, weakness_index, effective_elastic_thickness_km, thermal_anomaly_index,
                  mantle_upwelling_index, mantle_dynamic_support_index, compensated_buoyancy_index,
                  structural_fabric_strength, structural_zone_kind, fragmentation_propensity, fragment_ids,
                  kinematic_domain_ids,
              })
          }

          '''
          if anchor not in text:
              raise SystemExit('refinement test anchor missing')
          text = text.replace(anchor, addition + anchor)
          text += r'''

          #[cfg(test)]
          mod physical_inheritance_tests {
              use super::*;
              use crate::{build_icosphere, generate_crust_and_history, generate_lithosphere, generate_tectonics, GeologyRequest, LithosphereRequest, TectonicsRequest};

              fn coarse_world(level: u8) -> (GeodesicTopology, TectonicModel, CrustalModel, LithosphericModel, PlanetPhysicalParameters) {
                  let topology = build_icosphere(level).unwrap();
                  let parameters = PlanetPhysicalParameters::earthlike_reference();
                  let tectonics = generate_tectonics(&topology, &TectonicsRequest::new("wg375-inheritance", 14), parameters).unwrap();
                  let geology = generate_crust_and_history(&topology, &tectonics, &GeologyRequest::new("wg375-inheritance"), parameters).unwrap();
                  let lithosphere = generate_lithosphere(&topology, &tectonics, &geology, &LithosphereRequest::new("wg375-inheritance")).unwrap();
                  (topology, tectonics, geology, lithosphere, parameters)
              }

              #[test]
              fn accepted_wg2_wg3_wg35_truth_is_exact_on_inherited_samples() {
                  let (_coarse, tectonics, geology, lithosphere, parameters) = coarse_world(3);
                  let fine = build_icosphere(5).unwrap();
                  let state = inherit_physical_state(&fine, 3, &tectonics, &geology, &lithosphere, parameters).unwrap();
                  let count = expected_sample_count(3).unwrap() as usize;
                  assert_eq!(&state.plate_ids[..count], tectonics.plate_ids.as_slice());
                  assert_eq!(&state.crust_kind[..count], geology.crust_kind.as_slice());
                  assert_eq!(&state.crust_age_myr[..count], geology.crust_age_myr.as_slice());
                  assert_eq!(&state.strength_index[..count], lithosphere.strength_index.as_slice());
                  assert_eq!(&state.kinematic_domain_ids[..count], lithosphere.kinematic_domain_ids.as_slice());
              }

              #[test]
              fn physical_inheritance_is_deterministic_and_profile_identity_is_explicit() {
                  let (_coarse, tectonics, geology, lithosphere, parameters) = coarse_world(3);
                  let fine = build_icosphere(5).unwrap();
                  let a = inherit_physical_state(&fine, 3, &tectonics, &geology, &lithosphere, parameters).unwrap();
                  let b = inherit_physical_state(&fine, 3, &tectonics, &geology, &lithosphere, parameters).unwrap();
                  assert_eq!(a, b);
                  let mut dry = parameters;
                  dry.surface_water_mass_kg = 0.0;
                  let dry_state = inherit_physical_state(&fine, 3, &tectonics, &geology, &lithosphere, dry).unwrap();
                  assert_ne!(a.parameter_hash, dry_state.parameter_hash);
                  assert_ne!(a.inheritance_hash, dry_state.inheritance_hash);
                  assert_eq!(a.plate_ids, dry_state.plate_ids);
              }

              #[test]
              fn domain_constrained_interpolation_does_not_average_across_a_categorical_boundary() {
                  let fine = build_icosphere(2).unwrap();
                  let coarse_count = expected_sample_count(1).unwrap() as usize;
                  let map = build_refinement_map(&fine, 1).unwrap();
                  let mut domains = vec![0_u16; coarse_count];
                  let mut values = vec![10.0_f32; coarse_count];
                  domains[1] = 1;
                  values[1] = 100.0;
                  let refined = refine_scalar_f32_with_domains(&fine, 1, &values, &map, &domains).unwrap();
                  for sample in coarse_count..refined.len() {
                      assert!(refined[sample] >= 10.0 && refined[sample] <= 100.0);
                  }
                  assert_eq!(&refined[..coarse_count], values.as_slice());
              }
          }
          '''
          path.write_text(text)

          lib = Path('rust/interlink-worldgen/src/lib.rs')
          text = lib.read_text()
          old = 'pub use refinement::{\n    build_refinement_map, refine_categorical_u16, refine_categorical_u8, refine_scalar_f32,\n    refine_scalar_f64, refine_vector3_f64, RefinementMap, RefinementMetrics, MULTIRES_STAGE_ID,\n    MULTIRES_STAGE_VERSION,\n};'
          new = 'pub use refinement::{\n    build_refinement_map, inherit_physical_state, refine_categorical_u16, refine_categorical_u8,\n    refine_scalar_f32, refine_scalar_f32_with_domains, refine_scalar_f64, refine_vector3_f64,\n    InheritedPhysicalState, RefinementMap, RefinementMetrics, MULTIRES_STAGE_ID, MULTIRES_STAGE_VERSION,\n};'
          if old not in text:
              raise SystemExit('formatted refinement export block missing')
          lib.write_text(text.replace(old, new))

          cli = Path('rust/interlink-worldgen-cli/src/main.rs')
          text = cli.read_text()
          text = text.replace(
              'build_icosphere, generate_crust_and_history, generate_lithosphere, generate_synthetic,\n    generate_tectonics,',
              'build_icosphere, generate_crust_and_history, generate_lithosphere, generate_synthetic,\n    generate_tectonics, inherit_physical_state,'
          )
          text = text.replace(
              'struct Options { command: String, seed: String, width: u32, height: u32, iterations: u32, level: u8, plates: u16 }',
              'struct Options { command: String, seed: String, width: u32, height: u32, iterations: u32, level: u8, coarse_level: u8, plates: u16 }'
          )
          text = text.replace(
              '"interlink-worldgen-cli <generate|benchmark|topology|tectonics|geology|lithosphere> [--seed TEXT] [--width N] [--height N] [--iterations N] [--level N] [--plates N]"',
              '"interlink-worldgen-cli <generate|benchmark|topology|tectonics|geology|lithosphere|inheritance|profile> [--seed TEXT] [--width N] [--height N] [--iterations N] [--level N] [--coarse-level N] [--plates N]"'
          )
          text = text.replace(
              '"generate" | "benchmark" | "topology" | "tectonics" | "geology" | "lithosphere"',
              '"generate" | "benchmark" | "topology" | "tectonics" | "geology" | "lithosphere" | "inheritance" | "profile"'
          )
          text = text.replace(
              'let mut options = Options { command, seed: "worldgen-cli".to_owned(), width: 512, height: 256, iterations: 5, level: 5, plates: 16 };',
              'let mut options = Options { command, seed: "worldgen-cli".to_owned(), width: 512, height: 256, iterations: 5, level: 6, coarse_level: 4, plates: 16 };'
          )
          text = text.replace(
              '"--level" => options.level = u8::try_from(parse_u32("--level", args.next())?).map_err(|_| "--level exceeds u8 range".to_owned())?,',
              '"--level" => options.level = u8::try_from(parse_u32("--level", args.next())?).map_err(|_| "--level exceeds u8 range".to_owned())?,\n            "--coarse-level" => options.coarse_level = u8::try_from(parse_u32("--coarse-level", args.next())?).map_err(|_| "--coarse-level exceeds u8 range".to_owned())?,'
          )
          insert = r'''

          fn inheritance(options: &Options) -> Result<(), String> {
              if options.coarse_level > options.level { return Err("--coarse-level cannot exceed --level".to_owned()); }
              let started = Instant::now();
              let coarse = build_icosphere(options.coarse_level).map_err(|error| error.to_string())?;
              let fine = build_icosphere(options.level).map_err(|error| error.to_string())?;
              let parameters = PlanetPhysicalParameters::earthlike_reference();
              let tectonics = generate_tectonics(&coarse, &TectonicsRequest::new(options.seed.as_str(), options.plates), parameters).map_err(|error| error.to_string())?;
              let geology = generate_crust_and_history(&coarse, &tectonics, &GeologyRequest::new(options.seed.as_str()), parameters).map_err(|error| error.to_string())?;
              let lithosphere = generate_lithosphere(&coarse, &tectonics, &geology, &LithosphereRequest::new(options.seed.as_str())).map_err(|error| error.to_string())?;
              let inherited = inherit_physical_state(&fine, options.coarse_level, &tectonics, &geology, &lithosphere, parameters).map_err(|error| error.to_string())?;
              println!("Project Interlink Planet Engine WG-3.75 multiresolution inheritance");
              println!("engine_version={}", WORLDGEN_ENGINE_VERSION);
              println!("stage=foundation:multires-inheritance@1");
              println!("seed={} macro_plates={}", options.seed, options.plates);
              println!("levels coarse={} fine={}", options.coarse_level, options.level);
              println!("samples coarse={} fine={} added={}", inherited.map.metrics.coarse_sample_count, inherited.map.metrics.fine_sample_count, inherited.map.metrics.added_sample_count);
              println!("provenance_hash={} parameter_hash={} inheritance_hash={}", inherited.map.metrics.provenance_hash_hex(), inherited.parameter_hash_hex(), inherited.inheritance_hash_hex());
              println!("upstream tectonic_hash={} geology_hash={} lithosphere_hash={}", tectonics.metrics.tectonic_hash_hex(), geology.metrics.geology_hash_hex(), lithosphere.metrics.lithosphere_hash_hex());
              println!("earthlike equivalent_global_water_depth_m={:.3}", parameters.equivalent_global_water_depth_m());
              println!("elapsed_ms={:.3}", started.elapsed().as_secs_f64() * 1_000.0);
              Ok(())
          }

          fn profile(_options: &Options) -> Result<(), String> {
              let parameters = PlanetPhysicalParameters::earthlike_reference();
              parameters.validate().map_err(str::to_owned)?;
              println!("Project Interlink Planet Engine physical profile");
              println!("profile=earthlike-default hash={}", parameters.parameter_hash_hex());
              println!("radius_m={:.3} gravity_m_s2={:.6} mass_kg={:.6e} mean_bulk_density_kg_m3={:.3}", parameters.radius_m, parameters.surface_gravity_m_s2, parameters.mass_kg(), parameters.mean_bulk_density_kg_per_m3());
              println!("rotation_period_s={:.4} axial_tilt_deg={:.6} orbital_period_s={:.3} stellar_flux_w_m2={:.3}", parameters.rotation_period_s, parameters.axial_tilt_rad.to_degrees(), parameters.orbital_period_s, parameters.stellar_flux_w_m2);
              println!("surface_pressure_pa={:.3} surface_water_mass_kg={:.6e} ocean_density_kg_m3={:.3} equivalent_global_water_depth_m={:.3}", parameters.reference_surface_pressure_pa, parameters.surface_water_mass_kg, parameters.ocean_water_density_kg_per_m3, parameters.equivalent_global_water_depth_m());
              println!("isostatic_mantle_density_kg_m3={:.3} internal_heat_flux_w_m2={:.6} mantle_thermal_expansivity_per_k={:.8}", parameters.isostatic_mantle_density_kg_per_m3, parameters.internal_heat_flux_w_per_m2, parameters.mantle_thermal_expansivity_per_k);
              Ok(())
          }
          '''
          marker = '\nfn main() {'
          if marker not in text:
              raise SystemExit('CLI main marker missing')
          text = text.replace(marker, insert + marker)
          text = text.replace(
              '"lithosphere" => lithosphere(&options),\n        _ => generate_once(&options),',
              '"lithosphere" => lithosphere(&options),\n        "inheritance" => inheritance(&options),\n        "profile" => profile(&options),\n        _ => generate_once(&options),'
          )
          cli.write_text(text)

          package = Path('package.json')
          data = json.loads(package.read_text())
          scripts = data['scripts']
          scripts['worldgen:inheritance'] = 'cargo run -p interlink-worldgen-cli -- inheritance --seed test-world --coarse-level 4 --level 6 --plates 16'
          scripts['worldgen:profile'] = 'cargo run -p interlink-worldgen-cli -- profile'
          package.write_text(json.dumps(data, indent=2) + '\n')

          docs = Path('docs/worldgen-rewrite/MULTIRESOLUTION.md')
          docs.write_text('''# WG-3.75 Multiresolution Physical Inheritance\n\nWG-3.75 makes resolution changes an explicit deterministic operation instead of rerunning accepted physics at a finer level.\n\n```text\ncoarse WG-2/WG-3/WG-3.5 truth\n        ↓\nWG-1 stable sample ancestry\n        ↓\nWG-3.75 refinement operators\n        ↓\nfiner physical substrate for WG-4\n```\n\n## Contracts\n\n- Existing sample IDs are preserved exactly.\n- Continuous scalar/vector fields use hierarchical midpoint interpolation.\n- Categorical fields use a deterministic geodesic nearest-coarse-source map on the fine graph.\n- Domain-sensitive continuous fields use constrained interpolation so a midpoint does not average values across a categorical discontinuity.\n- The provenance map has its own deterministic hash.\n- The inherited physical state identity combines the refinement stage version, provenance hash, physical-parameter hash, and accepted WG-2/WG-3/WG-3.5 hashes.\n\nThe high-level `inherit_physical_state` bundle carries plate ownership, crust properties/history, lithospheric mechanics, structural state, and refined kinematic domains onto a finer topology. It does not add new geology or terrain. Fine-scale physics may later add detail, but inherited coarse samples remain exact.\n\n## Operator choice\n\nCrust properties are constrained by crust province. Mechanical strength/weakness/elastic thickness and fragmentation-related fields are constrained by WG-3.5 kinematic domain. Broad geological influence and mantle-support fields are interpolated continuously because those physical influences are allowed to cross present-day domain boundaries.\n\n## Non-goals\n\nWG-3.75 does not calculate elevation, bathymetry, sea level, hydrology, erosion, climate, lithology, resources, or gameplay geography.\n''')

          Path('docs/worldgen-rewrite/PLANET_PARAMETERS.md').write_text('''# Planet Physical Parameters\n\n`PlanetPhysicalParameters` remains Earth-like by default, preserving the existing accepted generation path, but now carries the physical values needed by later terrain/ocean stages and by future non-Earth rocky profiles.\n\nThe contract includes radius, gravity, rotation, axial tilt, orbital period, stellar flux, reference pressure, surface-water mass, ocean-water density, isostatic mantle density, internal heat flux, and mantle thermal expansivity.\n\nDerived helpers provide planetary mass from surface gravity/radius, mean bulk density, surface area, water volume, equivalent global water depth, and a deterministic parameter hash.\n\nThe parameter hash is part of WG-3.75 inherited-state identity. A dry or otherwise altered rocky profile therefore cannot silently reuse an Earth-like downstream terrain identity, even when the currently inherited tectonic fields are unchanged.\n\nWG-4 will consume the water inventory and isostatic parameters but owns the actual elevation/bathymetry and global sea-level solve.\n''')

          resolution = Path('docs/worldgen-rewrite/RESOLUTION.md')
          rtext = resolution.read_text()
          if '## WG-3.75 physical inheritance contract' not in rtext:
              rtext += '''\n## WG-3.75 physical inheritance contract\n\nWG-3.75 implements the previously documented coarse-to-fine checkpoint. Accepted upstream truth can now be inherited onto a finer canonical topology without rerunning or rerandomizing the coarse stages. This permits WG-4 terrain to begin at a finer process level while macro tectonic/crust/lithosphere identity remains anchored to its accepted coarse samples.\n'''
              resolution.write_text(rtext)
          PY

          cargo fmt --all
          npm install
          npm run build
          npm run test:ts
          cargo test --workspace
          cargo run -q -p interlink-worldgen-cli -- profile
          cargo run -q -p interlink-worldgen-cli -- inheritance --seed wg375-ci --coarse-level 4 --level 6 --plates 16

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/interlink-worldgen/src/refinement.rs rust/interlink-worldgen/src/lib.rs rust/interlink-worldgen-cli/src/main.rs package.json docs/worldgen-rewrite/MULTIRESOLUTION.md docs/worldgen-rewrite/PLANET_PARAMETERS.md docs/worldgen-rewrite/RESOLUTION.md dist
          git commit -m "WG-3.75: inherit accepted physics across resolution"
          git push origin HEAD:worldgen-rewrite-wg3-75-multires-parameters
