name: PR60 Reset Fix

on:
  push:
    branches: [chatgpt/live-rust-worker-cutover]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/live-rust-worker-cutover
      - name: Apply reset fix
        run: python scripts/pr60_reset_fix.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation/liveWorldReconfigure.js src/workspace/workspaceController.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Preserve destructive Reset Site semantics after Worker cutover"
            git push
          fi
