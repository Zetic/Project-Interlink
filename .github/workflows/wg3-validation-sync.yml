name: WG-3 Validation Sync

on:
  push:
    branches: [worldgen-rewrite-wg3-crust-history]

permissions:
  contents: write

concurrency:
  group: wg3-validation-sync
  cancel-in-progress: true

jobs:
  validate-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldgen-rewrite-wg3-crust-history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm install
      - name: Build and test TypeScript browser modules
        run: |
          npm run build
          npm run test:ts
      - name: Install Rust stable and browser target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Validate WG-3 core and inspect reference worlds
        run: |
          cargo test --workspace
          for seed in wg3-ci-a wg3-ci-b wg3-ci-c wg3-ci-d wg3-ci-e; do
            cargo run -q -p interlink-worldgen-cli -- geology --seed "$seed" --level 5 --plates 16
          done
          cargo check -p interlink-worldgen-wasm --target wasm32-unknown-unknown
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Rebuild committed Planet Engine WASM package
        run: bash scripts/build-worldgen-wasm.sh src/wasm-worldgen
      - name: Commit synchronized generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist src/wasm-worldgen
          if git diff --cached --quiet; then
            echo "WG-3 generated assets already synchronized."
            exit 0
          fi
          git commit -m "WG-3: synchronize browser and WASM generated assets"
          git push origin HEAD:worldgen-rewrite-wg3-crust-history
