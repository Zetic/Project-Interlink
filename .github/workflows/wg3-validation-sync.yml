name: WG-3 Validation Sync

on:
  push:
    branches: [worldgen-rewrite-wg3-crust-history]

permissions:
  contents: write

concurrency:
  group: wg3-validation-sync
  cancel-in-progress: true

jobs:
  validate-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldgen-rewrite-wg3-crust-history
          fetch-depth: 0
      - name: Apply final WG-3 source corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          geology = Path('rust/interlink-worldgen/src/geology.rs')
          text = geology.read_text()
          old = "let craton_count = ((tectonics.plates.len() as f64 * 0.48).round() as usize).clamp(4, MAX_CONTINENTAL_PROVINCES.min(tectonics.plates.len().max(4)));"
          new = "let craton_count = (6 + (random::mix64(province_seed ^ 0x3c6e_f372_fe94_f82b) % 9) as usize).min(MAX_CONTINENTAL_PROVINCES).min(topology.sample_count() as usize).max(1);"
          if old in text:
              text = text.replace(old, new, 1)
              geology.write_text(text)
              print('Decoupled inherited craton count from present-day plate count.')
          elif new in text:
              print('Inherited craton-count correction already applied.')
          else:
              raise SystemExit('Expected craton-count expression not found.')

          lab = Path('src/worldgen/diagnostics/worldgenLabStandalone.ts')
          text = lab.read_text()
          replacements = [
              ("if (!current || visualization.value !== 'motion') return;", "if (!current || visualization.value !== 'motion' || currentIdentity !== identity()) return;"),
              ("if (currentTectonics && currentIdentity === identity()) { redraw(); return; }", "if (currentTectonics) { redraw(); return; }"),
              ("if (requestedIdentity === identity()) { currentIdentity = requestedIdentity; redraw(); }", "if (requestedIdentity === identity() && currentIdentity === requestedIdentity) { redraw(); }"),
          ]
          changed = False
          for old_text, new_text in replacements:
              if old_text in text:
                  text = text.replace(old_text, new_text, 1)
                  changed = True
              elif new_text not in text:
                  raise SystemExit(f'Expected lab identity expression not found: {old_text}')
          if changed:
              lab.write_text(text)
              print('Locked lazy motion diagnostics to the generated WG-3 planet identity.')
          else:
              print('Diagnostic identity correction already applied.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm install
      - name: Build and test TypeScript browser modules
        run: |
          npm run build
          npm run test:ts
      - name: Install Rust stable and browser target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Validate WG-3 core and inspect reference worlds
        run: |
          cargo test --workspace
          for seed in wg3-ci-a wg3-ci-b wg3-ci-c wg3-ci-d wg3-ci-e; do
            cargo run -q -p interlink-worldgen-cli -- geology --seed "$seed" --level 5 --plates 16
          done
          cargo check -p interlink-worldgen-wasm --target wasm32-unknown-unknown
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Rebuild committed Planet Engine WASM package
        run: bash scripts/build-worldgen-wasm.sh src/wasm-worldgen
      - name: Commit validated source corrections and generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/interlink-worldgen/src/geology.rs src/worldgen/diagnostics/worldgenLabStandalone.ts dist src/wasm-worldgen
          if git diff --cached --quiet; then
            echo "WG-3 source corrections and generated assets already synchronized."
            exit 0
          fi
          git commit -m "WG-3: finalize crust independence and synchronized diagnostics"
          git push origin HEAD:worldgen-rewrite-wg3-crust-history
