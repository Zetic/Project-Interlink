name: WG-3.75 Core Gate

on:
  push:
    branches: [worldgen-rewrite-wg3-75-core-gate]

permissions:
  contents: write

concurrency:
  group: wg375-core-gate
  cancel-in-progress: true

jobs:
  implement-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldgen-rewrite-wg3-75-core-gate
          fetch-depth: 0

      - name: Implement WG-3.75 core
        run: |
          python3 <<'PY'
          from pathlib import Path

          refinement = r'''use crate::{expected_sample_count, GeodesicTopology, WorldgenError};
          use std::cmp::Ordering;
          use std::collections::BinaryHeap;

          pub const MULTIRES_STAGE_ID: &str = "foundation:multires-inheritance";
          pub const MULTIRES_STAGE_VERSION: u32 = 1;
          const FNV_OFFSET_BASIS: u64 = 0xcbf2_9ce4_8422_2325;
          const FNV_PRIME: u64 = 0x0000_0100_0000_01b3;
          const DISTANCE_EPSILON: f64 = 1.0e-15;

          #[derive(Clone, Debug, PartialEq)]
          pub struct RefinementMetrics {
              pub coarse_level: u8,
              pub fine_level: u8,
              pub coarse_sample_count: u32,
              pub fine_sample_count: u32,
              pub added_sample_count: u32,
              pub provenance_hash: u64,
          }

          impl RefinementMetrics {
              pub fn provenance_hash_hex(&self) -> String { format!("{:016x}", self.provenance_hash) }
          }

          #[derive(Clone, Debug, PartialEq)]
          pub struct RefinementMap {
              pub metrics: RefinementMetrics,
              pub nearest_coarse_source: Vec<u32>,
              pub inherited_sample_mask: Vec<u8>,
          }

          #[derive(Clone, Copy, Debug)]
          struct QueueEntry {
              distance: f64,
              source: u32,
              sample: u32,
          }

          impl PartialEq for QueueEntry {
              fn eq(&self, other: &Self) -> bool {
                  self.distance.to_bits() == other.distance.to_bits()
                      && self.source == other.source
                      && self.sample == other.sample
              }
          }
          impl Eq for QueueEntry {}
          impl PartialOrd for QueueEntry {
              fn partial_cmp(&self, other: &Self) -> Option<Ordering> { Some(self.cmp(other)) }
          }
          impl Ord for QueueEntry {
              fn cmp(&self, other: &Self) -> Ordering {
                  other.distance.total_cmp(&self.distance)
                      .then_with(|| other.source.cmp(&self.source))
                      .then_with(|| other.sample.cmp(&self.sample))
              }
          }

          fn fnv_update(mut hash: u64, bytes: &[u8]) -> u64 {
              for byte in bytes { hash ^= u64::from(*byte); hash = hash.wrapping_mul(FNV_PRIME); }
              hash
          }

          fn validate_levels(fine_topology: &GeodesicTopology, coarse_level: u8) -> Result<u32, WorldgenError> {
              if coarse_level > fine_topology.level() {
                  return Err(WorldgenError::InvalidRefinement("coarse level cannot exceed fine topology level"));
              }
              let coarse_count = expected_sample_count(coarse_level)
                  .ok_or(WorldgenError::InvalidRefinement("coarse topology level is unsupported"))?;
              if coarse_count > fine_topology.metrics().sample_count {
                  return Err(WorldgenError::InvalidRefinement("coarse sample count exceeds fine topology"));
              }
              for sample in 0..coarse_count as usize {
                  if fine_topology.birth_levels()[sample] > coarse_level {
                      return Err(WorldgenError::InvalidRefinement("stable inherited sample prefix is not preserved"));
                  }
              }
              Ok(coarse_count)
          }

          pub fn build_refinement_map(fine_topology: &GeodesicTopology, coarse_level: u8) -> Result<RefinementMap, WorldgenError> {
              let coarse_count = validate_levels(fine_topology, coarse_level)?;
              let fine_count = fine_topology.metrics().sample_count;
              let mut distances = vec![f64::INFINITY; fine_count as usize];
              let mut sources = vec![u32::MAX; fine_count as usize];
              let mut queue = BinaryHeap::new();

              for source in 0..coarse_count {
                  distances[source as usize] = 0.0;
                  sources[source as usize] = source;
                  queue.push(QueueEntry { distance: 0.0, source, sample: source });
              }

              while let Some(entry) = queue.pop() {
                  let index = entry.sample as usize;
                  let known_distance = distances[index];
                  let known_source = sources[index];
                  if entry.distance > known_distance + DISTANCE_EPSILON
                      || ((entry.distance - known_distance).abs() <= DISTANCE_EPSILON && entry.source != known_source)
                  {
                      continue;
                  }
                  let neighbors = fine_topology.neighbors_of(entry.sample);
                  let lengths = fine_topology.neighbor_arc_lengths_of(entry.sample);
                  for (neighbor, length) in neighbors.iter().zip(lengths.iter()) {
                      let candidate_distance = entry.distance + *length;
                      let neighbor_index = *neighbor as usize;
                      let improves_distance = candidate_distance + DISTANCE_EPSILON < distances[neighbor_index];
                      let ties_with_better_source = (candidate_distance - distances[neighbor_index]).abs() <= DISTANCE_EPSILON
                          && entry.source < sources[neighbor_index];
                      if improves_distance || ties_with_better_source {
                          distances[neighbor_index] = candidate_distance;
                          sources[neighbor_index] = entry.source;
                          queue.push(QueueEntry { distance: candidate_distance, source: entry.source, sample: *neighbor });
                      }
                  }
              }

              if sources.iter().any(|source| *source == u32::MAX) {
                  return Err(WorldgenError::InvalidRefinement("refinement provenance does not cover the fine topology"));
              }

              let inherited_sample_mask = (0..fine_count).map(|sample| u8::from(sample < coarse_count)).collect::<Vec<_>>();
              let mut hash = FNV_OFFSET_BASIS;
              hash = fnv_update(hash, &[coarse_level, fine_topology.level()]);
              hash = fnv_update(hash, &coarse_count.to_le_bytes());
              hash = fnv_update(hash, &fine_count.to_le_bytes());
              for source in &sources { hash = fnv_update(hash, &source.to_le_bytes()); }

              Ok(RefinementMap {
                  metrics: RefinementMetrics {
                      coarse_level,
                      fine_level: fine_topology.level(),
                      coarse_sample_count: coarse_count,
                      fine_sample_count: fine_count,
                      added_sample_count: fine_count - coarse_count,
                      provenance_hash: hash,
                  },
                  nearest_coarse_source: sources,
                  inherited_sample_mask,
              })
          }

          fn validate_scalar_len<T>(fine_topology: &GeodesicTopology, coarse_level: u8, coarse_values: &[T]) -> Result<u32, WorldgenError> {
              let coarse_count = validate_levels(fine_topology, coarse_level)?;
              if coarse_values.len() != coarse_count as usize {
                  return Err(WorldgenError::InvalidRefinement("coarse field length does not match coarse topology"));
              }
              Ok(coarse_count)
          }

          pub fn refine_scalar_f32(fine_topology: &GeodesicTopology, coarse_level: u8, coarse_values: &[f32]) -> Result<Vec<f32>, WorldgenError> {
              let coarse_count = validate_scalar_len(fine_topology, coarse_level, coarse_values)?;
              if coarse_values.iter().any(|value| !value.is_finite()) {
                  return Err(WorldgenError::InvalidRefinement("coarse scalar field contains non-finite values"));
              }
              let mut output = vec![0.0_f32; fine_topology.metrics().sample_count as usize];
              output[..coarse_count as usize].copy_from_slice(coarse_values);
              for sample in coarse_count as usize..output.len() {
                  let [a, b] = fine_topology.parent_edges()[sample];
                  if a == u32::MAX || b == u32::MAX || a as usize >= sample || b as usize >= sample {
                      return Err(WorldgenError::InvalidRefinement("fine sample has invalid hierarchical parents"));
                  }
                  output[sample] = (output[a as usize] + output[b as usize]) * 0.5;
              }
              Ok(output)
          }

          pub fn refine_scalar_f64(fine_topology: &GeodesicTopology, coarse_level: u8, coarse_values: &[f64]) -> Result<Vec<f64>, WorldgenError> {
              let coarse_count = validate_scalar_len(fine_topology, coarse_level, coarse_values)?;
              if coarse_values.iter().any(|value| !value.is_finite()) {
                  return Err(WorldgenError::InvalidRefinement("coarse scalar field contains non-finite values"));
              }
              let mut output = vec![0.0_f64; fine_topology.metrics().sample_count as usize];
              output[..coarse_count as usize].copy_from_slice(coarse_values);
              for sample in coarse_count as usize..output.len() {
                  let [a, b] = fine_topology.parent_edges()[sample];
                  if a == u32::MAX || b == u32::MAX || a as usize >= sample || b as usize >= sample {
                      return Err(WorldgenError::InvalidRefinement("fine sample has invalid hierarchical parents"));
                  }
                  output[sample] = (output[a as usize] + output[b as usize]) * 0.5;
              }
              Ok(output)
          }

          pub fn refine_vector3_f64(fine_topology: &GeodesicTopology, coarse_level: u8, coarse_values: &[[f64; 3]]) -> Result<Vec<[f64; 3]>, WorldgenError> {
              let coarse_count = validate_scalar_len(fine_topology, coarse_level, coarse_values)?;
              if coarse_values.iter().flatten().any(|value| !value.is_finite()) {
                  return Err(WorldgenError::InvalidRefinement("coarse vector field contains non-finite values"));
              }
              let mut output = vec![[0.0_f64; 3]; fine_topology.metrics().sample_count as usize];
              output[..coarse_count as usize].copy_from_slice(coarse_values);
              for sample in coarse_count as usize..output.len() {
                  let [a, b] = fine_topology.parent_edges()[sample];
                  if a == u32::MAX || b == u32::MAX || a as usize >= sample || b as usize >= sample {
                      return Err(WorldgenError::InvalidRefinement("fine sample has invalid hierarchical parents"));
                  }
                  for component in 0..3 {
                      output[sample][component] = (output[a as usize][component] + output[b as usize][component]) * 0.5;
                  }
              }
              Ok(output)
          }

          pub fn refine_categorical_u16(map: &RefinementMap, coarse_values: &[u16]) -> Result<Vec<u16>, WorldgenError> {
              if coarse_values.len() != map.metrics.coarse_sample_count as usize {
                  return Err(WorldgenError::InvalidRefinement("coarse categorical field length does not match refinement map"));
              }
              Ok(map.nearest_coarse_source.iter().map(|source| coarse_values[*source as usize]).collect())
          }

          pub fn refine_categorical_u8(map: &RefinementMap, coarse_values: &[u8]) -> Result<Vec<u8>, WorldgenError> {
              if coarse_values.len() != map.metrics.coarse_sample_count as usize {
                  return Err(WorldgenError::InvalidRefinement("coarse categorical field length does not match refinement map"));
              }
              Ok(map.nearest_coarse_source.iter().map(|source| coarse_values[*source as usize]).collect())
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              use crate::build_icosphere;

              #[test]
              fn scalar_refinement_preserves_every_coarse_sample_exactly() {
                  let fine = build_icosphere(5).unwrap();
                  let coarse_count = expected_sample_count(3).unwrap() as usize;
                  let coarse = (0..coarse_count).map(|sample| sample as f64 * 0.125 - 7.0).collect::<Vec<_>>();
                  let refined = refine_scalar_f64(&fine, 3, &coarse).unwrap();
                  assert_eq!(&refined[..coarse_count], coarse.as_slice());
                  assert_eq!(refined.len(), expected_sample_count(5).unwrap() as usize);
              }

              #[test]
              fn direct_and_staged_scalar_refinement_are_identical() {
                  let level4 = build_icosphere(4).unwrap();
                  let level6 = build_icosphere(6).unwrap();
                  let coarse_count = expected_sample_count(3).unwrap() as usize;
                  let coarse = (0..coarse_count).map(|sample| ((sample * 17) % 101) as f32 / 100.0).collect::<Vec<_>>();
                  let level4_values = refine_scalar_f32(&level4, 3, &coarse).unwrap();
                  let staged = refine_scalar_f32(&level6, 4, &level4_values).unwrap();
                  let direct = refine_scalar_f32(&level6, 3, &coarse).unwrap();
                  assert_eq!(direct, staged);
              }

              #[test]
              fn categorical_refinement_is_deterministic_complete_and_preserves_coarse_truth() {
                  let fine = build_icosphere(5).unwrap();
                  let coarse_count = expected_sample_count(3).unwrap() as usize;
                  let coarse = (0..coarse_count).map(|sample| (sample % 13) as u16).collect::<Vec<_>>();
                  let a = build_refinement_map(&fine, 3).unwrap();
                  let b = build_refinement_map(&fine, 3).unwrap();
                  assert_eq!(a, b);
                  let refined = refine_categorical_u16(&a, &coarse).unwrap();
                  assert_eq!(&refined[..coarse_count], coarse.as_slice());
                  assert!(a.nearest_coarse_source.iter().all(|source| (*source as usize) < coarse_count));
                  assert_eq!(a.inherited_sample_mask.iter().map(|value| u32::from(*value)).sum::<u32>(), coarse_count as u32);
              }

              #[test]
              fn backwards_refinement_is_rejected() {
                  let level3 = build_icosphere(3).unwrap();
                  assert!(build_refinement_map(&level3, 4).is_err());
              }
          }
          '''
          Path('rust/interlink-worldgen/src/refinement.rs').write_text(refinement)

          parameters = r'''const GRAVITATIONAL_CONSTANT_M3_KG_S2: f64 = 6.674_30e-11;
          const FOUR_PI: f64 = 12.566_370_614_359_172;
          const FNV_OFFSET_BASIS: u64 = 0xcbf2_9ce4_8422_2325;
          const FNV_PRIME: u64 = 0x0000_0100_0000_01b3;

          #[derive(Clone, Copy, Debug, PartialEq)]
          pub struct PlanetPhysicalParameters {
              pub radius_m: f64,
              pub surface_gravity_m_s2: f64,
              pub rotation_period_s: f64,
              pub axial_tilt_rad: f64,
              pub orbital_period_s: f64,
              pub stellar_flux_w_m2: f64,
              pub reference_surface_pressure_pa: f64,
              pub surface_water_mass_kg: f64,
              pub ocean_water_density_kg_per_m3: f64,
              pub isostatic_mantle_density_kg_per_m3: f64,
              pub internal_heat_flux_w_per_m2: f64,
              pub mantle_thermal_expansivity_per_k: f64,
          }

          impl PlanetPhysicalParameters {
              /// Earth-like reference values remain the default physical profile for all
              /// accepted stages. Additional fields make later terrain/climate stages
              /// parameter-complete without silently changing existing Earth-like worlds.
              pub const fn earthlike_reference() -> Self {
                  Self {
                      radius_m: 6_371_000.0,
                      surface_gravity_m_s2: 9.80665,
                      rotation_period_s: 86_164.0905,
                      axial_tilt_rad: 0.409_092_804_222_328_97,
                      orbital_period_s: 31_558_149.763_545_6,
                      stellar_flux_w_m2: 1_361.0,
                      reference_surface_pressure_pa: 101_325.0,
                      surface_water_mass_kg: 1.40e21,
                      ocean_water_density_kg_per_m3: 1_025.0,
                      isostatic_mantle_density_kg_per_m3: 3_300.0,
                      internal_heat_flux_w_per_m2: 0.087,
                      mantle_thermal_expansivity_per_k: 3.0e-5,
                  }
              }

              pub fn surface_area_m2(&self) -> f64 { FOUR_PI * self.radius_m * self.radius_m }
              pub fn mass_kg(&self) -> f64 { self.surface_gravity_m_s2 * self.radius_m * self.radius_m / GRAVITATIONAL_CONSTANT_M3_KG_S2 }
              pub fn mean_bulk_density_kg_per_m3(&self) -> f64 {
                  let volume = (4.0 / 3.0) * std::f64::consts::PI * self.radius_m.powi(3);
                  self.mass_kg() / volume
              }
              pub fn surface_water_volume_m3(&self) -> f64 {
                  if self.surface_water_mass_kg == 0.0 { 0.0 } else { self.surface_water_mass_kg / self.ocean_water_density_kg_per_m3 }
              }
              pub fn equivalent_global_water_depth_m(&self) -> f64 { self.surface_water_volume_m3() / self.surface_area_m2() }
              pub fn parameter_hash(&self) -> u64 {
                  let mut hash = FNV_OFFSET_BASIS;
                  for value in [
                      self.radius_m, self.surface_gravity_m_s2, self.rotation_period_s, self.axial_tilt_rad,
                      self.orbital_period_s, self.stellar_flux_w_m2, self.reference_surface_pressure_pa,
                      self.surface_water_mass_kg, self.ocean_water_density_kg_per_m3,
                      self.isostatic_mantle_density_kg_per_m3, self.internal_heat_flux_w_per_m2,
                      self.mantle_thermal_expansivity_per_k,
                  ] {
                      for byte in value.to_bits().to_le_bytes() { hash ^= u64::from(byte); hash = hash.wrapping_mul(FNV_PRIME); }
                  }
                  hash
              }
              pub fn parameter_hash_hex(&self) -> String { format!("{:016x}", self.parameter_hash()) }

              pub fn validate(&self) -> Result<(), &'static str> {
                  if !self.radius_m.is_finite() || self.radius_m <= 0.0 { return Err("planet radius must be finite and positive"); }
                  if !self.surface_gravity_m_s2.is_finite() || self.surface_gravity_m_s2 <= 0.0 { return Err("surface gravity must be finite and positive"); }
                  if !self.rotation_period_s.is_finite() || self.rotation_period_s <= 0.0 { return Err("rotation period must be finite and positive"); }
                  if !self.axial_tilt_rad.is_finite() { return Err("axial tilt must be finite"); }
                  if !self.orbital_period_s.is_finite() || self.orbital_period_s <= 0.0 { return Err("orbital period must be finite and positive"); }
                  if !self.stellar_flux_w_m2.is_finite() || self.stellar_flux_w_m2 <= 0.0 { return Err("stellar flux must be finite and positive"); }
                  if !self.reference_surface_pressure_pa.is_finite() || self.reference_surface_pressure_pa < 0.0 { return Err("reference surface pressure must be finite and non-negative"); }
                  if !self.surface_water_mass_kg.is_finite() || self.surface_water_mass_kg < 0.0 { return Err("surface water mass must be finite and non-negative"); }
                  if !self.ocean_water_density_kg_per_m3.is_finite() || self.ocean_water_density_kg_per_m3 <= 0.0 { return Err("ocean water density must be finite and positive"); }
                  if !self.isostatic_mantle_density_kg_per_m3.is_finite() || self.isostatic_mantle_density_kg_per_m3 <= 0.0 { return Err("isostatic mantle density must be finite and positive"); }
                  if !self.internal_heat_flux_w_per_m2.is_finite() || self.internal_heat_flux_w_per_m2 < 0.0 { return Err("internal heat flux must be finite and non-negative"); }
                  if !self.mantle_thermal_expansivity_per_k.is_finite() || self.mantle_thermal_expansivity_per_k < 0.0 { return Err("mantle thermal expansivity must be finite and non-negative"); }
                  Ok(())
              }
          }

          impl Default for PlanetPhysicalParameters {
              fn default() -> Self { Self::earthlike_reference() }
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn earthlike_reference_is_physically_valid_and_has_expected_derived_scale() {
                  let earth = PlanetPhysicalParameters::earthlike_reference();
                  earth.validate().unwrap();
                  assert!((5.9e24..6.1e24).contains(&earth.mass_kg()));
                  assert!((5_400.0..5_600.0).contains(&earth.mean_bulk_density_kg_per_m3()));
                  assert!((2_500.0..2_900.0).contains(&earth.equivalent_global_water_depth_m()));
                  assert_eq!(earth.parameter_hash(), PlanetPhysicalParameters::default().parameter_hash());
              }

              #[test]
              fn alternate_rocky_profiles_can_change_water_inventory_without_changing_default() {
                  let earth = PlanetPhysicalParameters::earthlike_reference();
                  let mut dry = earth;
                  dry.surface_water_mass_kg = 0.0;
                  dry.validate().unwrap();
                  assert_eq!(dry.equivalent_global_water_depth_m(), 0.0);
                  assert_ne!(dry.parameter_hash(), earth.parameter_hash());
                  assert_eq!(PlanetPhysicalParameters::default(), earth);
              }
          }
          '''
          Path('rust/interlink-worldgen/src/parameters.rs').write_text(parameters)

          lib = Path('rust/interlink-worldgen/src/lib.rs')
          text = lib.read_text()
          text = text.replace('mod random;\n', 'mod random;\nmod refinement;\n')
          text = text.replace('pub use random::derive_stage_seed;\n', 'pub use random::derive_stage_seed;\npub use refinement::{build_refinement_map, refine_categorical_u16, refine_categorical_u8, refine_scalar_f32, refine_scalar_f64, refine_vector3_f64, RefinementMap, RefinementMetrics, MULTIRES_STAGE_ID, MULTIRES_STAGE_VERSION};\n')
          text = text.replace('pub const WORLDGEN_ENGINE_VERSION: u32 = 5;', 'pub const WORLDGEN_ENGINE_VERSION: u32 = 6;')
          text = text.replace('    InvalidLithosphere(&\'static str),\n', '    InvalidLithosphere(&\'static str),\n    InvalidRefinement(&\'static str),\n')
          text = text.replace('            | Self::InvalidLithosphere(message) => formatter.write_str(message),', '            | Self::InvalidLithosphere(message)\n            | Self::InvalidRefinement(message) => formatter.write_str(message),')
          lib.write_text(text)

          client = Path('src/worldgen/worldgenClient.ts')
          text = client.read_text()
          old = "  const worker = new Worker(new URL('./worldgenWorker.js', import.meta.url), { type: 'module' });"
          new = "  const workerUrl = new URL('./worldgenWorker.js', import.meta.url);\n  workerUrl.searchParams.set('v', String(WORLDGEN_PROTOCOL_VERSION));\n  const worker = new Worker(workerUrl, { type: 'module' });"
          if old not in text:
              raise SystemExit('worker constructor pattern missing')
          client.write_text(text.replace(old, new))
          PY

          cargo fmt --all
          npm install
          npm run build
          cargo test -p interlink-worldgen

      - name: Commit validated core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/interlink-worldgen/src src/worldgen/worldgenClient.ts dist/worldgen/worldgenClient.js
          git commit -m "WG-3.75: add multiresolution inheritance core"
          git push origin HEAD:worldgen-rewrite-wg3-75-core-gate
