name: PR60 Core Patch

on:
  push:
    branches: [chatgpt/live-rust-worker-cutover]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/live-rust-worker-cutover
      - name: Apply core cutover patch
        run: python scripts/pr60_core_patch.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/interlink-runtime/src/lib.rs rust/interlink-wasm/src/runtime_bridge.rs src/simulation/packedWorldRuntimeCompiler.js src/simulation/packedWorldWorkerSetup.js
          if git diff --cached --quiet; then
            echo "No patch changes"
          else
            git commit -m "Wire live Rust world reconfiguration"
            git push
          fi
