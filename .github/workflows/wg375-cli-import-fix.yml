name: WG-3.75 CLI Import Fix

on:
  push:
    branches: [worldgen-rewrite-wg3-75-multires-parameters]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldgen-rewrite-wg3-75-multires-parameters
          fetch-depth: 0
      - name: Patch CLI import
        run: |
          python3 -c "from pathlib import Path; p=Path('rust/interlink-worldgen-cli/src/main.rs'); s=p.read_text(); old='generate_tectonics,\\n    GeologyRequest'; assert old in s; p.write_text(s.replace(old, 'generate_tectonics, inherit_physical_state,\\n    GeologyRequest', 1))"
          cargo fmt --all
          cargo check -p interlink-worldgen-cli
      - name: Commit import correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/interlink-worldgen-cli/src/main.rs
          git commit -m "WG-3.75: wire inheritance CLI import"
          git push origin HEAD:worldgen-rewrite-wg3-75-multires-parameters
