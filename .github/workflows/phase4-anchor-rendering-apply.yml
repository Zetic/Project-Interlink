name: Apply Phase 4 anchor-stable rendering

on:
  push:
    branches:
      - phase-4-anchor-stable-rendering
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-anchor-stable-rendering
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source correction
        run: python .github/phase4_anchor_rendering_apply.py
      - name: Remove one-time staging files
        run: |
          rm .github/phase4_anchor_rendering_apply.py
          rm .github/workflows/phase4-anchor-rendering-apply.yml
      - name: Install dependencies
        run: npm install
      - name: Remove incidental lockfile
        run: rm -f package-lock.json
      - name: Build TypeScript browser modules
        run: npm run build
      - name: Run JavaScript regression tests
        run: npm run test:js
      - name: Commit implementation and generated dist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Stabilize deep engineering zoom rendering'
          git push origin HEAD:phase-4-anchor-stable-rendering
