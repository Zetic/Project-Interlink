name: WG-1 Generated Asset Sync

on:
  push:
    branches: [worldgen-rewrite-wg1-topology]

permissions:
  contents: write

concurrency:
  group: wg1-generated-asset-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldgen-rewrite-wg1-topology
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm run test:ts
      - name: Install Rust stable and browser target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Validate Planet Engine core and topology CLI
        run: |
          cargo test --workspace
          cargo run -p interlink-worldgen-cli -- topology --level 4
          cargo check -p interlink-worldgen-wasm --target wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: bash scripts/build-worldgen-wasm.sh src/wasm-worldgen
      - name: Commit generated browser assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist src/wasm-worldgen
          if git diff --cached --quiet; then
            echo "Generated assets already synchronized."
            exit 0
          fi
          git commit -m "WG-1: sync generated browser assets"
          git push origin HEAD:worldgen-rewrite-wg1-topology
