name: Apply Phase 4 UI parity restoration

on:
  push:
    branches: [phase-4-ui-parity]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply UI parity source changes
        run: python3 scripts/phase4_ui_parity_apply.py
      - name: Remove one-time staging files
        run: rm scripts/phase4_ui_parity_apply.py .github/workflows/phase4-ui-parity-apply.yml
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build TypeScript browser modules
        run: npm run build
      - name: Run JavaScript regression tests
        run: npm run test:js
      - name: Commit implementation and generated dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore original node, navigation and DEBUG UI"
          git push
