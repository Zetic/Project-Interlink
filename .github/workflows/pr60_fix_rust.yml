name: PR60 Fix Rust

on:
  push:
    branches: [chatgpt/live-rust-worker-cutover]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/live-rust-worker-cutover
      - name: Apply fixes
        run: python scripts/pr60_fix_rust.py
      - name: Format
        run: cargo fmt --all
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/interlink-wasm/src/lib.rs rust/interlink-wasm/src/runtime_bridge.rs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix live reconfiguration WASM bridge"
            git push
          fi
