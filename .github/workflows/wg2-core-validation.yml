name: WG-2 Branch Validation

on:
  push:
    branches: [worldgen-rewrite-wg2-tectonics]

permissions:
  contents: write

concurrency:
  group: wg2-branch-validation
  cancel-in-progress: true

jobs:
  validate-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldgen-rewrite-wg2-tectonics
          fetch-depth: 0
      - name: Apply macro-plate variance tuning
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('rust/interlink-worldgen/src/tectonics.rs')
          text = path.read_text()
          old = '(expected_spacing_rad * 0.40).clamp(0.10, 0.55)'
          new = '(expected_spacing_rad * 0.20).clamp(0.07, 0.32)'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
              print('Applied broader deterministic macro-plate seed spacing.')
          elif new in text:
              print('Macro-plate variance tuning already applied.')
          else:
              raise SystemExit('Expected plate-seed spacing expression was not found.')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm install
      - name: Build TypeScript browser modules
        run: npm run build
      - name: Run TypeScript regression tests
        run: npm run test:ts
      - name: Install Rust stable and browser target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Validate Planet Engine core and WG-2 CLI
        run: |
          cargo test --workspace
          for seed in ci-wg2 ci-wg2-b ci-wg2-c ci-wg2-d ci-wg2-e; do
            cargo run -q -p interlink-worldgen-cli -- tectonics --seed "$seed" --level 5 --plates 18
          done
          cargo check -p interlink-worldgen-wasm --target wasm32-unknown-unknown
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Build committed Planet Engine WASM package
        run: bash scripts/build-worldgen-wasm.sh src/wasm-worldgen
      - name: Commit validated WG-2 source and generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/interlink-worldgen/src/tectonics.rs dist src/wasm-worldgen
          if git diff --cached --quiet; then
            echo "WG-2 source and generated assets already synchronized."
            exit 0
          fi
          git commit -m "WG-2: widen macro plate size distribution"
          git push origin HEAD:worldgen-rewrite-wg2-tectonics
