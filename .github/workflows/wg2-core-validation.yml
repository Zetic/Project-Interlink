name: WG-2 Branch Validation

on:
  push:
    branches: [worldgen-rewrite-wg2-tectonics]

permissions:
  contents: write

concurrency:
  group: wg2-branch-validation
  cancel-in-progress: true

jobs:
  validate-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldgen-rewrite-wg2-tectonics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm install
      - name: Build TypeScript browser modules
        run: npm run build
      - name: Run TypeScript regression tests
        run: npm run test:ts
      - name: Install Rust stable and browser target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Validate Planet Engine core and WG-2 CLI
        run: |
          cargo test --workspace
          cargo run -p interlink-worldgen-cli -- tectonics --seed ci-wg2 --level 5 --plates 18
          cargo check -p interlink-worldgen-wasm --target wasm32-unknown-unknown
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Build committed Planet Engine WASM package
        run: bash scripts/build-worldgen-wasm.sh src/wasm-worldgen
      - name: Commit generated browser assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist src/wasm-worldgen
          if git diff --cached --quiet; then
            echo "Generated assets already synchronized."
            exit 0
          fi
          git commit -m "WG-2: sync generated browser assets"
          git push origin HEAD:worldgen-rewrite-wg2-tectonics
