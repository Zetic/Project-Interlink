name: WG-3.75 Persist CLI Shape

on:
  push:
    branches: [worldgen-rewrite-wg3-75-multires-parameters]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldgen-rewrite-wg3-75-multires-parameters
          fetch-depth: 0
      - name: Add multiresolution CLI options
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('rust/interlink-worldgen-cli/src/main.rs')
          s = p.read_text()
          s = s.replace('    level: u8,\n    plates: u16,', '    level: u8,\n    coarse_level: u8,\n    plates: u16,', 1)
          s = s.replace('<generate|benchmark|topology|tectonics|geology|lithosphere>', '<generate|benchmark|topology|tectonics|geology|lithosphere|inheritance|profile>', 1)
          s = s.replace('[--level N] [--plates N]', '[--level N] [--coarse-level N] [--plates N]', 1)
          s = s.replace('        "generate" | "benchmark" | "topology" | "tectonics" | "geology" | "lithosphere"', '        "generate" | "benchmark" | "topology" | "tectonics" | "geology" | "lithosphere" | "inheritance" | "profile"', 1)
          s = s.replace('        level: 5,\n        plates: 16,', '        level: 6,\n        coarse_level: 4,\n        plates: 16,', 1)
          level_block = '''            "--level" => {\n                options.level = u8::try_from(parse_u32("--level", args.next())?)\n                    .map_err(|_| "--level exceeds u8 range".to_owned())?\n            }'''
          coarse_block = level_block + '''\n            "--coarse-level" => {\n                options.coarse_level = u8::try_from(parse_u32("--coarse-level", args.next())?)\n                    .map_err(|_| "--coarse-level exceeds u8 range".to_owned())?\n            }'''
          if level_block not in s:
              raise SystemExit('formatted --level block not found')
          s = s.replace(level_block, coarse_block, 1)
          p.write_text(s)
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/interlink-worldgen-cli/src/main.rs
          git commit -m "WG-3.75: add multiresolution CLI options"
          git push origin HEAD:worldgen-rewrite-wg3-75-multires-parameters
