name: PR61 Rust-only cleanup

on:
  push:
    branches: [chatgpt/rust-only-runtime-cleanup]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable and browser target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Apply Rust-only cleanup
        run: |
          python scripts/pr61_rust_only_cleanup.py
          python scripts/pr61_cleanup_followup.py
          python scripts/pr61_cleanup_testfix.py

      - name: Guard Rust-only production architecture
        run: |
          ! grep -R "worldSimulationTick\|simulationAdvance\|worldSimulationAdvance\|main-thread-compiled" src --include='*.js'
          ! grep -R "core/processes/physics\|core/processes/executors\|continuousProcessing\|continuousComminution\|packedProcessRuntime\|packedRoutingRuntime" src --include='*.js'
          ! grep -R "processExecution\|processPhysics\|performanceTelemetry" src --include='*.js'
          ! grep -R "simulateExtractorNode\|simulateFeederNode\|simulateMergerNode\|simulateCrusherNode\|simulateJawCrusherNode\|simulateConeCrusherNode\|simulateBallMillNode\|simulateScreenNode\|simulateSplitterNode\|simulateMagSepNode\|simulateRoastingFurnaceNode" src --include='*.js'

      - name: Run JavaScript tests
        run: npm test

      - name: Run Rust workspace tests
        run: cargo test --workspace

      - name: Compile browser WASM target
        run: cargo check -p interlink-wasm --target wasm32-unknown-unknown

      - name: Remove temporary cleanup machinery
        run: |
          rm -f scripts/pr61_rust_only_cleanup.py
          rm -f scripts/pr61_cleanup_followup.py
          rm -f scripts/pr61_cleanup_testfix.py
          rm -f .github/workflows/pr61-rust-only-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove redundant JavaScript simulation backend"
          git push
