name: WG-3.75 Integration Fix

on:
  push:
    branches: [worldgen-rewrite-wg3-75-multires-parameters]

permissions:
  contents: write

concurrency:
  group: wg375-integration-fix
  cancel-in-progress: true

jobs:
  integrate-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldgen-rewrite-wg3-75-multires-parameters
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Implement inherited physical state
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          path = Path('rust/interlink-worldgen/src/refinement.rs')
          text = path.read_text()
