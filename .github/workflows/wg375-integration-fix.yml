          new_use = 'use crate::{expected_sample_count, CrustalModel, GeodesicTopology, LithosphericModel, PlanetPhysicalParameters, TectonicModel, WorldgenError};'
          if old_use not in text:
              raise SystemExit('refinement import anchor missing')
          text = text.replace(old_use, new_use, 1)
          anchor = '#[cfg(test)]\nmod tests {'
