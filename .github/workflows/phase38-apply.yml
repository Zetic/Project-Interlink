name: Apply Phase 3.8 engineering zoom refinement

on:
  push:
    branches: [phase-3-8-engineering-zoom-lod]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply engineering zoom and node LOD changes
        run: python3 scripts/phase38_apply.py
      - name: Use tolerant floating-point assertion
        run: python3 -c "from pathlib import Path; p=Path('tests/mapCameraState.test.js'); s=p.read_text(); p.write_text(s.replace('  assert.equal(wheelSensitivityForZoom(2 ** 19), WHEEL_ENGINEERING_SENSITIVITY);', '  assert.ok(Math.abs(wheelSensitivityForZoom(2 ** 19) - WHEEL_ENGINEERING_SENSITIVITY) < 1e-12);'))"
      - name: Install dependencies
        run: npm install
      - name: Build TypeScript browser modules
        run: npm run build
      - name: Run JavaScript regression tests
        run: npm run test:js
      - name: Commit implementation and generated dist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/map/mapRenderer.ts tests/mapCameraState.test.js dist
          git commit -m "Refine engineering-scale wheel zoom and node LOD"
          git push
