name: Build Phase 3.6 depth changes

on:
  push:
    branches: [phase-3-6-world-scale-depth]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build TypeScript
        run: npm run build
      - name: Run browser regression tests
        run: npm run test:js
      - name: Commit generated browser modules
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dist; then
            echo "No generated dist changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Build Phase 3.6 browser modules"
          git push
