name: PR60 Cutover Workspace

on:
  push:
    branches: [chatgpt/live-rust-worker-cutover]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/live-rust-worker-cutover
      - name: Apply workspace cutover
        run: python scripts/pr60_cutover_workspace.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation/materialStream.js src/simulation/simulationEngine.js src/workspace/workspaceState.js src/workspace/graph/nodeRemoval.js src/workspace/inspector/inspectionViewModel.js src/workspace/workspaceController.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Cut player workspace over to realtime runtime"
            git push
          fi
