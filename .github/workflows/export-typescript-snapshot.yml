name: Export TypeScript Snapshot
on:
  push:
    branches: [chatgpt/typescript-infer-sandbox]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/typescript-infer-sandbox
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install temporary TypeScript 5 language service
        run: npm install --no-save --package-lock=false typescript@5.9.3
      - uses: actions/upload-artifact@v4
        with:
          name: typescript-language-service-snapshot
          path: |
            src
            tests
            node_modules
            package.json
            package-lock.json
            tsconfig.json
          include-hidden-files: true
          retention-days: 1
