name: TypeScript Relaxed Probe
on:
  push:
    branches: [chatgpt/typescript-browser-conversion]
permissions:
  contents: write
jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[ts-relaxed-probe]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/typescript-browser-conversion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Measure non-strict compiler baseline
        run: |
          set +e
          npx tsc --noEmit -p tsconfig.json --strict false > /tmp/relaxed.log 2>&1
          EXIT=$?
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re
          text = Path('/tmp/relaxed.log').read_text(errors='ignore')
          rows = re.findall(r'^(.*?\.ts)\((\d+),(\d+)\): error (TS\d+):', text, re.M)
          by_code = Counter(r[3] for r in rows)
          by_file = Counter(r[0] for r in rows)
          out = [f'errors={len(rows)}', '', 'By code:']
          out += [f'{k}: {v}' for k,v in by_code.most_common()]
          out += ['', 'By file:']
          out += [f'{k}: {v}' for k,v in by_file.most_common()]
          out += ['', 'First errors:', '\n'.join(text.splitlines()[:100])]
          Path('typescript-nonstrict-probe.txt').write_text('\n'.join(out)+'\n')
          PY
          echo "EXIT=$EXIT" >> typescript-nonstrict-probe.txt
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typescript-nonstrict-probe.txt
          git commit -m "Measure non-strict TypeScript baseline [ts-relaxed-probe]"
          git push origin HEAD:chatgpt/typescript-browser-conversion
