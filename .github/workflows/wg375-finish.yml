name: WG-3.75 Final Integration

on:
  push:
    branches: [worldgen-rewrite-wg3-75-multires-parameters]

jobs:
  finish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust stable and browser target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Apply WG-3.75 final source wiring
        run: python scripts/wg375_finish.py
      - name: Install Node dependencies
        run: npm install
      - name: Build and test browser modules
        run: |
          npm run build
          npm run test:ts
      - name: Test Rust workspace and native diagnostics
        run: |
          cargo test --workspace
          cargo run -p interlink-worldgen-cli -- inheritance --seed ci-wg3-75 --coarse-level 4 --level 6 --plates 18
          cargo run -p interlink-worldgen-cli -- profile
          cargo check -p interlink-worldgen-wasm --target wasm32-unknown-unknown
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Rebuild committed Planet Engine WASM package
        run: npm run build:worldgen-wasm
      - name: Commit final WG-3.75 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "WG-3.75: complete browser transport and asset sync"
          git push origin HEAD:worldgen-rewrite-wg3-75-multires-parameters
