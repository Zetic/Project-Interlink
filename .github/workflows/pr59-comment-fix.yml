name: PR59 Comment Fix

on:
  push:
    branches:
      - chatgpt/rust-wasm-worker-cutover

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[pr59-comment-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rust-wasm-worker-cutover
          fetch-depth: 0

      - name: Fix state-import documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/simulation/packedWorldRuntimeCompiler.js')
          text = path.read_text()
          old = '''  // Furnace retained-zone state is compiled and retained in the setup snapshot,\n  // but is intentionally not applied by this PR's WASM adapter yet. The next\n  // Worker cutover will import the entire world atomically rather than introducing\n  // a per-zone/per-fraction live synchronization protocol.\n'''
          new = '''  // Furnace retained-zone state is compiled into the one-time setup snapshot and\n  // imported atomically before the Rust world is sealed. Normal fixed-step play\n  // never synchronizes zones or material fractions apparatus-by-apparatus.\n'''
          if text.count(old) != 1:
              raise SystemExit('stale furnace import comment not found exactly once')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit documentation correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation/packedWorldRuntimeCompiler.js
          git commit -m "Correct Worker state-import documentation [pr59-comment-fixed]"
          git push origin HEAD:chatgpt/rust-wasm-worker-cutover
