name: WG-3.5 Validation Sync

on:
  push:
    branches: [worldgen-rewrite-wg3-5-lithosphere]

permissions:
  contents: write

concurrency:
  group: wg35-validation-sync
  cancel-in-progress: true

jobs:
  validate-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: worldgen-rewrite-wg3-5-lithosphere
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm install

      - name: Build and test browser modules
        run: |
          npm run build
          npm run test:ts

      - name: Install Rust stable and browser target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Validate WG-3.5 core and inspect reference worlds
        run: |
          cargo test --workspace
          for seed in wg35-ci-a wg35-ci-b wg35-ci-c wg35-ci-d wg35-ci-e; do
            cargo run -q -p interlink-worldgen-cli -- lithosphere --seed "$seed" --level 5 --plates 16
          done
          cargo check -p interlink-worldgen-wasm --target wasm32-unknown-unknown

      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Rebuild committed Planet Engine WASM package
        run: bash scripts/build-worldgen-wasm.sh src/wasm-worldgen

      - name: Commit generated browser assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist src/wasm-worldgen
          if git diff --cached --quiet; then
            echo "WG-3.5 generated assets already synchronized."
            exit 0
          fi
          git commit -m "WG-3.5: synchronize generated browser assets"
          git push origin HEAD:worldgen-rewrite-wg3-5-lithosphere
