name: PR60 Regenerate WASM

on:
  push:
    branches: [chatgpt/live-rust-worker-cutover]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/live-rust-worker-cutover
      - name: Install Rust browser target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Build browser WASM package
        run: npm run check:wasm-package
      - name: Update committed Worker assets
        run: |
          cp target/wasm-package/interlink_wasm.js src/wasm/interlink_wasm.js
          cp target/wasm-package/interlink_wasm.d.ts src/wasm/interlink_wasm.d.ts
          cp target/wasm-package/interlink_wasm_bg.wasm src/wasm/interlink_wasm_bg.wasm
          cp target/wasm-package/interlink_wasm_bg.wasm.d.ts src/wasm/interlink_wasm_bg.wasm.d.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wasm
          if git diff --cached --quiet; then
            echo "Committed WASM package already current"
          else
            git commit -m "Regenerate browser WASM package for Worker cutover"
            git push
          fi
