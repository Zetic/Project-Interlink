name: Apply Phase 5 build

on:
  push:
    branches:
      - phase-5-material-authoring-runtime-contract

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-5-material-authoring-runtime-contract
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Remove incidental lockfile
        run: rm -f package-lock.json
      - name: Build TypeScript browser modules
        run: npm run build
      - name: Run JavaScript regression tests
        run: npm run test:js
      - name: Remove one-time workflow and commit generated dist
        run: |
          rm -f .github/workflows/phase5-build-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist .github/workflows/phase5-build-apply.yml
          if ! git diff --cached --quiet; then
            git commit -m "Build Phase 5 browser modules"
            git push origin HEAD:phase-5-material-authoring-runtime-contract
          fi
