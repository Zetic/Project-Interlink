name: Simulation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    name: Browser and TypeScript tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm install

      - name: Build TypeScript browser modules
        run: npm run build

      - name: Commit exact generated browser modules
        run: |
          if git diff --quiet -- dist; then
            echo "Generated browser modules already match source."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist
            git commit -m "Sync generated geological history modules"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Run TypeScript regression tests
        run: npm run test:ts

  rust:
    name: Rust core and WASM browser package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable and browser target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Run Rust core tests
        run: cargo test --workspace

      - name: Compile browser WASM target
        run: cargo check -p interlink-wasm --target wasm32-unknown-unknown

      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Package browser WASM module
        run: npm run check:wasm-package

      - name: Verify packaged Worker assets
        run: |
          test -s target/wasm-package/interlink_wasm.js
          test -s target/wasm-package/interlink_wasm_bg.wasm
          cmp target/wasm-package/interlink_wasm.js src/wasm/interlink_wasm.js
          cmp target/wasm-package/interlink_wasm.d.ts src/wasm/interlink_wasm.d.ts
          cmp target/wasm-package/interlink_wasm_bg.wasm src/wasm/interlink_wasm_bg.wasm
