name: Simulation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    name: Browser and TypeScript tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm install

      - name: Build TypeScript browser modules
        run: npm run build

      - name: Verify generated browser modules are committed
        run: git diff --exit-code -- dist

      - name: Run TypeScript regression tests
        run: npm run test:ts

  rust:
    name: Rust core and WASM browser packages
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable and browser target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Run Rust core tests
        run: cargo test --workspace

      - name: Smoke-test native Planet Engine diagnostics
        run: |
          cargo run -p interlink-worldgen-cli -- generate --seed ci-wg0 --width 64 --height 32
          cargo run -p interlink-worldgen-cli -- topology --level 4

      - name: Compile browser WASM targets
        run: |
          cargo check -p interlink-wasm --target wasm32-unknown-unknown
          cargo check -p interlink-worldgen-wasm --target wasm32-unknown-unknown

      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Package browser WASM modules
        run: |
          npm run check:wasm-package
          npm run check:worldgen-wasm-package

      - name: Verify packaged runtime Worker assets
        run: |
          test -s target/wasm-package/interlink_wasm.js
          test -s target/wasm-package/interlink_wasm_bg.wasm
          cmp target/wasm-package/interlink_wasm.js src/wasm/interlink_wasm.js
          cmp target/wasm-package/interlink_wasm.d.ts src/wasm/interlink_wasm.d.ts
          cmp target/wasm-package/interlink_wasm_bg.wasm src/wasm/interlink_wasm_bg.wasm

      - name: Verify committed Planet Engine WASM assets
        run: |
          test -s src/wasm-worldgen/interlink_worldgen_wasm.js
          test -s src/wasm-worldgen/interlink_worldgen_wasm.d.ts
          test -s src/wasm-worldgen/interlink_worldgen_wasm_bg.wasm
          cmp target/worldgen-wasm-package/interlink_worldgen_wasm.js src/wasm-worldgen/interlink_worldgen_wasm.js
          cmp target/worldgen-wasm-package/interlink_worldgen_wasm.d.ts src/wasm-worldgen/interlink_worldgen_wasm.d.ts
          cmp target/worldgen-wasm-package/interlink_worldgen_wasm_bg.wasm src/wasm-worldgen/interlink_worldgen_wasm_bg.wasm
