name: Simulation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  javascript:
    name: JavaScript simulation tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run JavaScript tests
        run: npm test

  rust:
    name: Rust core and WASM browser package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable and browser target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Run Rust core tests
        run: cargo test --workspace

      - name: Compile browser WASM target
        run: cargo check -p interlink-wasm --target wasm32-unknown-unknown

      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Package browser WASM module
        run: npm run check:wasm-package

      - name: Verify packaged Worker assets
        run: |
          test -s target/wasm-package/interlink_wasm.js
          test -s target/wasm-package/interlink_wasm_bg.wasm
