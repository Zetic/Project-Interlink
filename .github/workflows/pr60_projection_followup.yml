name: PR60 Projection Followup

on:
  push:
    branches: [chatgpt/live-rust-worker-cutover]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/live-rust-worker-cutover
      - name: Apply projection follow-up
        run: python scripts/pr60_projection_followup.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/workspace/workspaceController.js src/workspace/inspector/inspectionViewModel.js rust/interlink-runtime/src/lib.rs rust/interlink-wasm/src/runtime_bridge.rs src/simulation/packedWorldRuntimeCompiler.js src/simulation/packedWorldWorkerSetup.js src/simulation/runtimePresentation.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Complete compact Worker presentation projection"
            git push
          fi
