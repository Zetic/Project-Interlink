[workspace]
members = [
  "rust/interlink-core",
  "rust/interlink-processes",
  "rust/interlink-routing",
  "rust/interlink-comminution",
  "rust/interlink-separation",
  "rust/interlink-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
